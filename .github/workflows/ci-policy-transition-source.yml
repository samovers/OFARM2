            --tag ofarm-postgresql-conformance:local \
            deployment/postgresql/ofarm_ed25519
      - name: Authenticate the derived PostgreSQL release identity
        run: |
          .review-venv/bin/python deployment/postgresql/native_evidence.py \
            conformance-environment \
            --checked-identity \
              deployment/postgresql/ofarm_ed25519/native_release_identity.json \
            --checked-receipt \
              deployment/postgresql/ofarm_ed25519/native_evidence_receipt.json \
            --verification-currentness \
              deployment/postgresql/ofarm_ed25519/native_evidence_verification_currentness.json \
            --archive \
              .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar \
            --source-directory deployment/postgresql/ofarm_ed25519 \
            --repository-root . \
            --image-name ofarm-postgresql-conformance:local \
            --archive-reference \
              .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar \
            > .artifacts/derived-postgresql/environment
          cat .artifacts/derived-postgresql/environment >> "$GITHUB_ENV"
      - name: Load the exact authenticated derived PostgreSQL image
        run: |
          if docker image inspect ofarm-postgresql-conformance:local \
            >/dev/null 2>&1
          then
            exit 1
          fi
          docker load --input \
            .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar
          observed_id="$(docker image inspect --format '{{.Id}}' \
            ofarm-postgresql-conformance:local)"
          if test "$observed_id" != \
              "$ISSUE174_DERIVED_POSTGRES_CHILD_DIGEST" \
            && test "$observed_id" != \
              "$ISSUE174_DERIVED_POSTGRES_CONFIG_DIGEST"
          then
            exit 1
          fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            ofarm-postgresql-conformance:local)" = "linux/amd64"
      - name: Start three independent derived PostgreSQL clusters
        run: |
          docker run --detach --name ofarm-conformance-main \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=ofarm \
            --env POSTGRES_DB=ofarm_kernel \
            --publish 5432:5432 \
            --health-cmd "pg_isready -U ofarm -d ofarm_kernel" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          docker run --detach --name ofarm-conformance-audit \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=audit-ofarm \
            --env POSTGRES_DB=postgres \
            --publish 5433:5432 \
            --health-cmd "pg_isready -U ofarm -d postgres" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          docker run --detach --name ofarm-conformance-provisioning \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=tenant-ofarm \
            --env POSTGRES_DB=postgres \
            --publish 5434:5432 \
            --health-cmd "pg_isready -U ofarm -d postgres" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          for container in \
            ofarm-conformance-main \
            ofarm-conformance-audit \
            ofarm-conformance-provisioning
          do
            state=""
            for attempt in {1..30}
            do
              state="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if test "$state" = healthy
              then
                break
              fi
              sleep 2
            done
            test "$state" = healthy
          done
      - name: Complete Kernel baseline run 1
        id: baseline-run-1
        env:
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_TENANT_PROVISIONING_PG_ADMIN_DSN: "host=localhost port=5434 dbname=postgres user=ofarm password=tenant-ofarm"
          OFARM_SECURITY_AUDIT_PG_ADMIN_DSN: "host=localhost port=5433 dbname=postgres user=ofarm password=audit-ofarm"
        run: .review-venv/bin/python conformance/run_review_baseline.py run --output-dir .artifacts/review-baseline/run-1
      - name: Complete Kernel baseline run 2
        id: baseline-run-2
        env:
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_TENANT_PROVISIONING_PG_ADMIN_DSN: "host=localhost port=5434 dbname=postgres user=ofarm password=tenant-ofarm"
          OFARM_SECURITY_AUDIT_PG_ADMIN_DSN: "host=localhost port=5433 dbname=postgres user=ofarm password=audit-ofarm"
        run: .review-venv/bin/python conformance/run_review_baseline.py run --output-dir .artifacts/review-baseline/run-2
      - name: Prove clean-run equivalence
        id: baseline-equivalence
        run: >-
          .review-venv/bin/python conformance/run_review_baseline.py compare
          .artifacts/review-baseline/run-1/review-baseline-evidence.json
          .artifacts/review-baseline/run-2/review-baseline-evidence.json
          --output .artifacts/review-baseline/equivalence.json
      - name: Preserve root platform MVP evidence lane
        id: platform-evidence
        env:
          OFARM_PG_DSN: "host=localhost port=5432 dbname=ofarm_kernel_test user=ofarm password=ofarm"
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_PLATFORM_MVP_EVIDENCE_DIR: .artifacts/platform-evidence
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          TZ: UTC
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: .review-venv/bin/python -m pytest kernel/tests/test_conformance.py -q -p no:cacheprovider
      - name: Upload provisional conformance evidence
        env:
          OFARM_TRANSITION_TOOLS_DIRECTORY: ${{ runner.temp }}/ofarm-ci-transition-control
          OFARM_TRANSITION_TOOLS_SUPERVISOR: ${{ runner.temp }}/ofarm-ci-transition-control/tools.py
          OFARM_TRANSITION_TOOLS_JOB: conformance
          NODE_OPTIONS: --require=${{ runner.temp }}/ofarm-ci-transition-control/node.cjs
          OFARM_TRANSITION_NODE_SHA256: b312724c91c619380825c35b99b8544f7135cb40733a2c40047d32622c8877a1
          OFARM_TRANSITION_TOOLS_SHA256: 4abd4a334400c667ed5c5676b06d107aa67ff3078eadf8405c01adb7481108fd
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_TLS_REJECT_UNAUTHORIZED: ""
          SSL_CERT_FILE: ""
          SSL_CERT_DIR: ""
          GIT_SSL_CAINFO: ""
          GIT_SSL_CAPATH: ""
          GIT_SSL_NO_VERIFY: ""
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
