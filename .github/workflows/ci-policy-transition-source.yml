  native-verifier:
    needs: baseline-admission
    if: needs.baseline-admission.outputs.eligible == 'true'
    name: native verifier (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            python-architecture: x64
            machine: x86_64
            docker-architecture: x86_64
            buildx-sha256: >-
              f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b
          - runner: ubuntu-24.04-arm
            architecture: arm64
            python-architecture: arm64
            machine: aarch64
            docker-architecture: aarch64
            buildx-sha256: >-
              c34e32dd6ea2653d960d6c099c9f09b9077e4a37504d2d31e5066eccc3904231
    runs-on: ${{ matrix.runner }}
