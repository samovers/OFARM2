  source-guard:
    name: source guard
    needs: baseline-admission
    if: needs.baseline-admission.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Start trusted transition tool observation before checkout
        env:
          TRANSITION_TOOLS_JOB: source-guard
          OFARM_BOOTSTRAP_TOOLS: 
          OFARM_BOOTSTRAP_NODE: 
          OFARM_BOOTSTRAP_EXECUTION: 
          OFARM_BOOTSTRAP_GH_RELAY: 
          OFARM_BOOTSTRAP_CURL: 
        run: |
          /usr/bin/python3 -I -S - <<'OFARM_TRANSITION_BOOTSTRAP'
          import base64, hashlib, os, pathlib, shutil, subprocess, zlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          assert root.is_absolute() and str(root.resolve()) == str(root)
          action = root / "ofarm-ci-transition-action"
          control = root / "ofarm-ci-transition-control"
          assert (workspace / "../../_temp/ofarm-ci-transition-action").resolve() == action
          created = []
          start_attempted = False
          try:
              for directory in (control, action):
                  directory.mkdir(mode=0o700)
                  created.append(directory)
              assets = {name: os.environ[key] for name, key in {'tools.py': 'OFARM_BOOTSTRAP_TOOLS', 'node.cjs': 'OFARM_BOOTSTRAP_NODE', 'execution.py': 'OFARM_BOOTSTRAP_EXECUTION', 'gh_relay.py': 'OFARM_BOOTSTRAP_GH_RELAY', 'curl.py': 'OFARM_BOOTSTRAP_CURL'}.items()}
              digests = {'tools.py': '4abd4a334400c667ed5c5676b06d107aa67ff3078eadf8405c01adb7481108fd', 'node.cjs': 'b312724c91c619380825c35b99b8544f7135cb40733a2c40047d32622c8877a1', 'execution.py': '629c7986aa777fcb128dba9fd11617b001a437b2afbd9629d014b33b2f1cc842', 'gh_relay.py': 'adece9ba22843f7c3d3c8867f552b469470fa21de54961e890a90e81f478a402', 'curl.py': '703880fb280ae970a12258c93affa899c835f648bdfd7ee14cc9eb928d45302e'}
              for name, encoded in assets.items():
                  data = zlib.decompress(base64.b64decode(encoded, validate=True))
                  assert hashlib.sha256(data).hexdigest() == digests[name]
                  target = control / name
                  target.write_bytes(data)
