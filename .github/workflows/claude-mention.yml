# Claude — on-demand assistant (@claude mentions).
#
# Complements claude-review.yml (which auto-reviews every new PR). This
# workflow wakes only when a new issue or a comment contains "@claude", then
# runs Claude Code with that request as context, e.g.
#   "@claude review this again"
#   "@claude why does the conformance check fail here?"
#   "@claude draft a fix for issue #172"
#
# Unlike the reviewer, this mode CAN modify the repo: it may push commits and
# open PRs. AGENTS.md still binds it — conformance must pass before any commit,
# the law freeze holds, privacy rule 1 is absolute. Treat its output as a draft
# to review, never as settled truth.
#
# Requires the same repo secret CLAUDE_CODE_OAUTH_TOKEN. Action pinned by SHA.
# To have Claude's commits re-trigger conformance CI, install the Claude GitHub
# App (https://github.com/apps/claude); otherwise it still runs but its commits
# won't automatically start other workflows.

name: claude-mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write        # may push commits/branches when asked to implement
  pull-requests: write   # comment on and open PRs
  issues: write          # comment on issues

jobs:
  claude:
    # Only spend a run when someone actually mentions @claude.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
