# Deterministic review baseline for issue #168, extended with issue #174's
# live PostgreSQL provisioning boundary. It makes no production-readiness claim.
name: conformance

on:
  push:
    branches: ["main", "m1/**"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate and install the exact Buildx client
        env:
          BUILDX_ASSET_SHA256: >-
            f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b
        run: |
          buildx_asset="${RUNNER_TEMP}/buildx-v0.34.1.linux-amd64"
          buildx_binary="${RUNNER_TEMP}/ofarm-buildx-v0.34.1-linux-amd64"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 3 --output "${buildx_asset}" \
            "https://github.com/docker/buildx/releases/download/v0.34.1/buildx-v0.34.1.linux-amd64"
          printf '%s  %s\n' "${BUILDX_ASSET_SHA256}" "${buildx_asset}" | \
            sha256sum --check --strict
          install -m 0755 "${buildx_asset}" "${buildx_binary}"
          test "$("${buildx_binary}" version)" = \
            "github.com/docker/buildx v0.34.1 e0b0e77d18d3379bc1e0d55f3b37de288d36fe47"
          printf 'ISSUE174_BUILDX=%s\n' "${buildx_binary}" >> "${GITHUB_ENV}"
          printf 'ISSUE174_BUILDER=%s\n' \
            issue174-conformance-builder >> "${GITHUB_ENV}"
      - name: Create pinned native image builder
        run: |
          test -x "${ISSUE174_BUILDX}"
          "${ISSUE174_BUILDX}" create \
            --name "${ISSUE174_BUILDER}" \
            --driver docker-container \
            --driver-opt \
              image=moby/buildkit@sha256:c457984bd29f04d6acc90c8d9e717afe3922ae14665f3187e0096976fe37b1c8 \
            --buildkitd-flags \
              '--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host' \
            --use
          "${ISSUE174_BUILDX}" inspect \
            --builder "${ISSUE174_BUILDER}" --bootstrap
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          architecture: x64
      - name: Create isolated locked environment
        run: |
          python -m venv .review-venv
          .review-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-pip.lock
          .review-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-baseline.lock
          .review-venv/bin/python -m pip check
          python -m venv .review-tools-venv
          .review-tools-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-pip.lock
          .review-tools-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-tools.lock
          .review-tools-venv/bin/python -m pip check
      - name: Ruff PostgreSQL implementation
        run: >-
          .review-tools-venv/bin/python -m ruff check
          deployment/postgresql
          kernel/tests/test_migration_sets.py
          kernel/tests/test_postgresql_*.py
          kernel/tests/test_review_baseline.py
      - name: Authenticate tenant migration release
        run: .review-venv/bin/python -m deployment.postgresql.preflight_tenant_migrations
      - name: Authenticate security-audit migration release
        run: .review-venv/bin/python -m deployment.postgresql.preflight_security_audit_migrations
      - name: Authenticate and install the exact GitHub CLI
        shell: bash
        env:
          GITHUB_CLI_ARCHIVE_SHA256: >-
            83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
        run: |
          set -euo pipefail

          if test "${GH_TOKEN+x}" = x || test "${GITHUB_TOKEN+x}" = x
          then
            exit 1
          fi
          if git config --local --name-only --get-regexp \
              '^http\..*\.extraheader$' >/dev/null
          then
            exit 1
          else
            credential_status="$?"
            test "${credential_status}" -eq 1
          fi

          gh_install_root="$(mktemp --directory \
            "${RUNNER_TEMP}/ofarm-gh-v2.96.0.XXXXXX")"
          gh_archive="${gh_install_root}/gh_2.96.0_linux_amd64.tar.gz"
          gh_extract="${gh_install_root}/extract"
          gh_path_file="${gh_install_root}/canonical-path"
          gh_stdout="${gh_install_root}/version.stdout"
          gh_stderr="${gh_install_root}/version.stderr"
          mkdir -- "${gh_extract}"

          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 3 --output "${gh_archive}" \
            "https://github.com/cli/cli/releases/download/v2.96.0/gh_2.96.0_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            "${GITHUB_CLI_ARCHIVE_SHA256}" "${gh_archive}" | \
            sha256sum --check --strict
          tar --extract --gzip --file "${gh_archive}" \
            --directory "${gh_extract}" --strip-components=2 \
            gh_2.96.0_linux_amd64/bin/gh

          .review-venv/bin/python - \
              "${gh_extract}/gh" "${gh_extract}" "${gh_path_file}" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          candidate = Path(sys.argv[1]).resolve(strict=True)
          expected_parent = Path(sys.argv[2]).resolve(strict=True)
          file_stat = candidate.stat()
          if (
              candidate.parent != expected_parent
              or not stat.S_ISREG(file_stat.st_mode)
              or not os.access(candidate, os.X_OK)
          ):
              raise SystemExit(1)
          Path(sys.argv[3]).write_text(str(candidate) + "\n", encoding="ascii")
          PY
          IFS= read -r gh_binary < "${gh_path_file}"
          test -n "${gh_binary}"

          gh_status=0
          "${gh_binary}" version >"${gh_stdout}" 2>"${gh_stderr}" || \
            gh_status="$?"
          test "${gh_status}" -eq 0
          test -f "${gh_stdout}"
          test -f "${gh_stderr}"
          test ! -s "${gh_stderr}"
          .review-venv/bin/python - "${gh_stdout}" <<'PY'
          import sys
          from pathlib import Path

          from deployment.postgresql.native_release_identity import (
              NATIVE_RELEASE_GITHUB_CLI_VERSION_OUTPUT,
          )

          if Path(sys.argv[1]).read_bytes() != (
              NATIVE_RELEASE_GITHUB_CLI_VERSION_OUTPUT
          ):
              raise SystemExit(1)
          PY

          printf 'OFARM_NATIVE_EVIDENCE_GITHUB_CLI=%s\n' \
            "${gh_binary}" >> "${GITHUB_ENV}"
          printf '%s\n' "${gh_binary%/*}" >> "${GITHUB_PATH}"
      - name: Cryptographically reverify retained native release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .review-venv/bin/python - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          recorded_value = os.environ.get("OFARM_NATIVE_EVIDENCE_GITHUB_CLI")
          selected_value = shutil.which("gh")
          if recorded_value is None or selected_value is None:
              raise SystemExit(1)
          recorded = Path(recorded_value)
          if not recorded.is_absolute():
              raise SystemExit(1)
          recorded = recorded.resolve(strict=True)
          selected = Path(selected_value).resolve(strict=True)
          file_stat = selected.stat()
          if (
              selected != recorded
              or not stat.S_ISREG(file_stat.st_mode)
              or not os.access(selected, os.X_OK)
          ):
              raise SystemExit(1)
          PY
          .review-venv/bin/python deployment/postgresql/native_evidence.py \
            verify-frozen-evidence-receipt \
            --release-identity \
              deployment/postgresql/ofarm_ed25519/native_release_identity.json \
            --evidence-receipt \
              deployment/postgresql/ofarm_ed25519/native_evidence_receipt.json \
            --source-directory deployment/postgresql/ofarm_ed25519 \
            --repository-root .
      - name: Reject whitespace errors
        run: >-
          git diff --check
          origin/${{ github.event.repository.default_branch }}...HEAD
      - name: Build the derived PostgreSQL image
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          mkdir -p .artifacts/derived-postgresql
          "${ISSUE174_BUILDX}" build \
            --builder "${ISSUE174_BUILDER}" \
            --file deployment/postgresql/ofarm_ed25519/Containerfile \
            --platform linux/amd64 \
            --pull \
            --provenance=false \
            --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --output \
              "type=docker,dest=.artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar,oci-mediatypes=true" \
            --tag ofarm-postgresql-conformance:local \
            deployment/postgresql/ofarm_ed25519
      - name: Authenticate the derived PostgreSQL release identity
        run: |
          .review-venv/bin/python deployment/postgresql/native_evidence.py \
            conformance-environment \
            --checked-identity \
              deployment/postgresql/ofarm_ed25519/native_release_identity.json \
            --checked-receipt \
              deployment/postgresql/ofarm_ed25519/native_evidence_receipt.json \
            --archive \
              .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar \
            --source-directory deployment/postgresql/ofarm_ed25519 \
            --repository-root . \
            --image-name ofarm-postgresql-conformance:local \
            --archive-reference \
              .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar \
            > .artifacts/derived-postgresql/environment
          cat .artifacts/derived-postgresql/environment >> "$GITHUB_ENV"
      - name: Load the exact authenticated derived PostgreSQL image
        run: |
          if docker image inspect ofarm-postgresql-conformance:local \
            >/dev/null 2>&1
          then
            exit 1
          fi
          docker load --input \
            .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar
          observed_id="$(docker image inspect --format '{{.Id}}' \
            ofarm-postgresql-conformance:local)"
          if test "$observed_id" != \
              "$ISSUE174_DERIVED_POSTGRES_CHILD_DIGEST" \
            && test "$observed_id" != \
              "$ISSUE174_DERIVED_POSTGRES_CONFIG_DIGEST"
          then
            exit 1
          fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            ofarm-postgresql-conformance:local)" = "linux/amd64"
      - name: Start three independent derived PostgreSQL clusters
        run: |
          docker run --detach --name ofarm-conformance-main \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=ofarm \
            --env POSTGRES_DB=ofarm_kernel \
            --publish 5432:5432 \
            --health-cmd "pg_isready -U ofarm -d ofarm_kernel" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          docker run --detach --name ofarm-conformance-audit \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=audit-ofarm \
            --env POSTGRES_DB=postgres \
            --publish 5433:5432 \
            --health-cmd "pg_isready -U ofarm -d postgres" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          docker run --detach --name ofarm-conformance-provisioning \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=tenant-ofarm \
            --env POSTGRES_DB=postgres \
            --publish 5434:5432 \
            --health-cmd "pg_isready -U ofarm -d postgres" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          for container in \
            ofarm-conformance-main \
            ofarm-conformance-audit \
            ofarm-conformance-provisioning
          do
            state=""
            for attempt in {1..30}
            do
              state="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if test "$state" = healthy
              then
                break
              fi
              sleep 2
            done
            test "$state" = healthy
          done
      - name: Complete Kernel baseline run 1
        env:
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_TENANT_PROVISIONING_PG_ADMIN_DSN: "host=localhost port=5434 dbname=postgres user=ofarm password=tenant-ofarm"
          OFARM_SECURITY_AUDIT_PG_ADMIN_DSN: "host=localhost port=5433 dbname=postgres user=ofarm password=audit-ofarm"
        run: .review-venv/bin/python conformance/run_review_baseline.py run --output-dir .artifacts/review-baseline/run-1
      - name: Complete Kernel baseline run 2
        env:
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_TENANT_PROVISIONING_PG_ADMIN_DSN: "host=localhost port=5434 dbname=postgres user=ofarm password=tenant-ofarm"
          OFARM_SECURITY_AUDIT_PG_ADMIN_DSN: "host=localhost port=5433 dbname=postgres user=ofarm password=audit-ofarm"
        run: .review-venv/bin/python conformance/run_review_baseline.py run --output-dir .artifacts/review-baseline/run-2
      - name: Prove clean-run equivalence
        run: >-
          .review-venv/bin/python conformance/run_review_baseline.py compare
          .artifacts/review-baseline/run-1/review-baseline-evidence.json
          .artifacts/review-baseline/run-2/review-baseline-evidence.json
          --output .artifacts/review-baseline/equivalence.json
      - name: Preserve root platform MVP evidence lane
        env:
          OFARM_PG_DSN: "host=localhost port=5432 dbname=ofarm_kernel_test user=ofarm password=ofarm"
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_PLATFORM_MVP_EVIDENCE_DIR: .artifacts/platform-evidence
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          TZ: UTC
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: .review-venv/bin/python -m pytest kernel/tests/test_conformance.py -q -p no:cacheprovider
      - name: Upload deterministic review baseline
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: review-baseline
          path: .artifacts/review-baseline/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload root platform MVP evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-mvp-evidence
          path: .artifacts/platform-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Stop disposable PostgreSQL clusters
        if: always()
        run: |
          docker rm --force \
            ofarm-conformance-main \
            ofarm-conformance-audit \
            ofarm-conformance-provisioning \
            || true
      - name: Remove pinned native image builder
        if: always()
        run: |
          if test -x "${ISSUE174_BUILDX:-}"
          then
            "${ISSUE174_BUILDX}" rm "${ISSUE174_BUILDER}" || true
          fi

  native-verifier:
    name: native verifier (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            python-architecture: x64
            machine: x86_64
            docker-architecture: x86_64
            buildx-sha256: >-
              f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b
          - runner: ubuntu-24.04-arm
            architecture: arm64
            python-architecture: arm64
            machine: aarch64
            docker-architecture: aarch64
            buildx-sha256: >-
              c34e32dd6ea2653d960d6c099c9f09b9077e4a37504d2d31e5066eccc3904231
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      BUILDX_METADATA_PROVENANCE: disabled
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          architecture: ${{ matrix.python-architecture }}
      - name: Authenticate and install the exact Buildx client
        env:
          BUILDX_ASSET_SHA256: ${{ matrix.buildx-sha256 }}
        run: |
          buildx_asset="${RUNNER_TEMP}/buildx-v0.34.1.linux-${{ matrix.architecture }}"
          buildx_binary="${RUNNER_TEMP}/ofarm-buildx-v0.34.1-linux-${{ matrix.architecture }}"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 3 --output "${buildx_asset}" \
            "https://github.com/docker/buildx/releases/download/v0.34.1/buildx-v0.34.1.linux-${{ matrix.architecture }}"
          printf '%s  %s\n' "${BUILDX_ASSET_SHA256}" "${buildx_asset}" | \
            sha256sum --check --strict
          install -m 0755 "${buildx_asset}" "${buildx_binary}"
          test "$("${buildx_binary}" version)" = \
            "github.com/docker/buildx v0.34.1 e0b0e77d18d3379bc1e0d55f3b37de288d36fe47"
          printf 'ISSUE174_BUILDX=%s\n' "${buildx_binary}" >> "${GITHUB_ENV}"
          printf 'ISSUE174_BUILDER=%s\n' \
            "issue174-native-${{ matrix.architecture }}-builder" >> "${GITHUB_ENV}"
      - name: Create pinned native image builder
        run: |
          test -x "${ISSUE174_BUILDX}"
          "${ISSUE174_BUILDX}" create \
            --name "${ISSUE174_BUILDER}" \
            --driver docker-container \
            --driver-opt \
              image=moby/buildkit@sha256:c457984bd29f04d6acc90c8d9e717afe3922ae14665f3187e0096976fe37b1c8 \
            --buildkitd-flags \
              '--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host' \
            --use
          "${ISSUE174_BUILDX}" inspect \
            --builder "${ISSUE174_BUILDER}" --bootstrap
      - name: Authenticate generated native verifier vectors
        run: >-
          python
          deployment/postgresql/ofarm_ed25519/generate_ofarm_ed25519_vectors.py
          --check
      - name: Require a native runner and Docker engine
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "$(docker info --format '{{.Architecture}}')" = \
            "${{ matrix.docker-architecture }}"
          test "$("${ISSUE174_BUILDX}" version)" = \
            "github.com/docker/buildx v0.34.1 e0b0e77d18d3379bc1e0d55f3b37de288d36fe47"
          mkdir -p \
            ".artifacts/native/${{ matrix.architecture }}/first" \
            ".artifacts/native/${{ matrix.architecture }}/second" \
            ".artifacts/native/${{ matrix.architecture }}/attestations"
          "${ISSUE174_BUILDX}" version > \
            ".artifacts/native/${{ matrix.architecture }}/buildx-version.txt"
      - name: Refuse every unsupported sanitizer selector
        run: |
          set +e
          "${ISSUE174_BUILDX}" build \
            --builder "${ISSUE174_BUILDER}" \
            --file deployment/postgresql/ofarm_ed25519/Containerfile \
            --platform "linux/${{ matrix.architecture }}" \
            --target sanitizer \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --build-arg SANITIZER=memory \
            --progress=plain \
            deployment/postgresql/ofarm_ed25519 \
            > ".artifacts/native/${{ matrix.architecture }}/invalid-sanitizer.log" \
            2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep --fixed-strings \
            'SANITIZER must be exactly address or undefined' \
            ".artifacts/native/${{ matrix.architecture }}/invalid-sanitizer.log"
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        shell: bash
        run: |
          set -o pipefail
          for sanitizer in address undefined
          do
            "${ISSUE174_BUILDX}" build \
              --builder "${ISSUE174_BUILDER}" \
              --file deployment/postgresql/ofarm_ed25519/Containerfile \
              --platform "linux/${{ matrix.architecture }}" \
              --target sanitizer \
              --pull \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 \
              --build-arg "SANITIZER=$sanitizer" \
              --progress=plain \
              deployment/postgresql/ofarm_ed25519 \
              2>&1 | tee \
              ".artifacts/native/${{ matrix.architecture }}/${sanitizer}.log"
          done
      - name: Exercise every verifier failure mapping in PostgreSQL
        run: |
          "${ISSUE174_BUILDX}" build \
            --builder "${ISSUE174_BUILDER}" \
            --file deployment/postgresql/ofarm_ed25519/Containerfile \
            --platform "linux/${{ matrix.architecture }}" \
            --target failure-semantics \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --progress=plain \
            deployment/postgresql/ofarm_ed25519
      - name: Produce two clean native child builds
        run: |
          for build in first second
          do
            "${ISSUE174_BUILDX}" build \
              --builder "${ISSUE174_BUILDER}" \
              --file deployment/postgresql/ofarm_ed25519/Containerfile \
              --platform "linux/${{ matrix.architecture }}" \
              --pull \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 \
              --output \
                "type=docker,dest=.artifacts/native/${{ matrix.architecture }}/${build}-image.docker.tar,oci-mediatypes=true" \
              --tag "ofarm-ed25519-${{ matrix.architecture }}:${build}" \
              deployment/postgresql/ofarm_ed25519
            "${ISSUE174_BUILDX}" build \
              --builder "${ISSUE174_BUILDER}" \
              --file deployment/postgresql/ofarm_ed25519/Containerfile \
              --platform "linux/${{ matrix.architecture }}" \
              --target evidence-artifacts \
              --pull \
              --provenance=false \
              --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 \
              --output \
                "type=local,dest=.artifacts/native/${{ matrix.architecture }}/${build}" \
              deployment/postgresql/ofarm_ed25519
            if test "$build" = first
            then
              "${ISSUE174_BUILDX}" prune \
                --builder "${ISSUE174_BUILDER}" \
                --all --force
            fi
          done
      - name: Prove child and installed-artifact reproducibility
        run: >-
          python deployment/postgresql/native_evidence.py compare-builds
          --first-archive
          ".artifacts/native/${{ matrix.architecture }}/first-image.docker.tar"
          --second-archive
          ".artifacts/native/${{ matrix.architecture }}/second-image.docker.tar"
          --first-artifacts
          ".artifacts/native/${{ matrix.architecture }}/first"
          --second-artifacts
          ".artifacts/native/${{ matrix.architecture }}/second"
          --platform "linux/${{ matrix.architecture }}"
          --source-commit "${{ github.sha }}"
          --output
          ".artifacts/native/${{ matrix.architecture }}/reproducibility.json"
      - name: Load and verify the authenticated clean native child
        run: |
          image="ofarm-ed25519-${{ matrix.architecture }}:second"
          if docker image inspect "$image" >/dev/null 2>&1
          then
            exit 1
          fi
          docker load --input \
            ".artifacts/native/${{ matrix.architecture }}/second-image.docker.tar"
          expected_child="$(python -c \
            'import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["child_digest"])' \
            ".artifacts/native/${{ matrix.architecture }}/reproducibility.json")"
          expected_config="$(python -c \
            'import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["config_digest"])' \
            ".artifacts/native/${{ matrix.architecture }}/reproducibility.json")"
          observed_id="$(docker image inspect --format '{{.Id}}' "$image")"
          if test "$observed_id" != "$expected_child" \
            && test "$observed_id" != "$expected_config"
          then
            exit 1
          fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "$image")" = "linux/${{ matrix.architecture }}"
          rm -- \
            ".artifacts/native/${{ matrix.architecture }}/first-image.docker.tar" \
            ".artifacts/native/${{ matrix.architecture }}/second-image.docker.tar"
          test ! -e \
            ".artifacts/native/${{ matrix.architecture }}/first-image.docker.tar"
          test ! -e \
            ".artifacts/native/${{ matrix.architecture }}/second-image.docker.tar"
      - name: Run the exact live PostgreSQL verifier smoke
        run: |
          docker run --detach --name ofarm-native-live \
            --env POSTGRES_PASSWORD=ofarm-native-test \
            --volume \
              "${{ github.workspace }}/deployment/postgresql/ofarm_ed25519/ofarm_ed25519_vectors.sql:/tmp/ofarm_ed25519_vectors.sql:ro" \
            "ofarm-ed25519-${{ matrix.architecture }}:second"
          state=""
          for attempt in {1..30}
          do
            state="$(docker inspect --format '{{.State.Status}}' ofarm-native-live)"
            if test "$state" = running \
              && docker exec ofarm-native-live pg_isready --username postgres
            then
              break
            fi
            sleep 2
          done
          test "$state" = running
          docker exec --interactive --user postgres ofarm-native-live \
            psql --username postgres --dbname postgres \
            < deployment/postgresql/ofarm_ed25519/ofarm_ed25519_live_test.sql
      - name: Produce bounded OCI, SBOM, and max-provenance evidence
        run: |
          "${ISSUE174_BUILDX}" build \
            --builder "${ISSUE174_BUILDER}" \
            --file deployment/postgresql/ofarm_ed25519/Containerfile \
            --platform "linux/${{ matrix.architecture }}" \
            --pull \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --tag "ofarm-ed25519-evidence:${{ matrix.architecture }}" \
            --attest \
              "type=provenance,mode=max,version=v0.2,builder-id=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --attest \
              type=sbom,generator=docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68 \
            --output \
              "type=oci,dest=.artifacts/native/${{ matrix.architecture }}/ofarm-ed25519.oci.tar,oci-mediatypes=true" \
            --metadata-file \
              ".artifacts/native/${{ matrix.architecture }}/attested-metadata.json" \
            deployment/postgresql/ofarm_ed25519
          python deployment/postgresql/native_evidence.py collect-oci \
            --archive \
              ".artifacts/native/${{ matrix.architecture }}/ofarm-ed25519.oci.tar" \
            --reproducibility \
              ".artifacts/native/${{ matrix.architecture }}/reproducibility.json" \
            --platform "linux/${{ matrix.architecture }}" \
            --source-commit "${{ github.sha }}" \
            --containerfile deployment/postgresql/ofarm_ed25519/Containerfile \
            --builder-id \
              "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --output-directory \
              ".artifacts/native/${{ matrix.architecture }}/attestations"
          test "$(du --bytes --summarize \
            ".artifacts/native/${{ matrix.architecture }}" | cut --fields=1)" \
            -le 600000000
      - name: Upload bounded native verifier evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-verifier-${{ matrix.architecture }}
          path: .artifacts/native/${{ matrix.architecture }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable native PostgreSQL
        if: always()
        run: docker rm --force ofarm-native-live || true
      - name: Remove pinned native image builder
        if: always()
        run: |
          if test -x "${ISSUE174_BUILDX:-}"
          then
            "${ISSUE174_BUILDX}" rm "${ISSUE174_BUILDER}" || true
          fi

  native-verifier-index:
    name: native verifier canonical index
    needs: native-verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          architecture: x64
      - name: Download authenticated amd64 evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-verifier-amd64
          path: .artifacts/native-fan-in/amd64
      - name: Download authenticated arm64 evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-verifier-arm64
          path: .artifacts/native-fan-in/arm64
      - name: Re-authenticate both native evidence archives
        run: |
          for architecture in amd64 arm64
          do
            python deployment/postgresql/native_evidence.py collect-oci \
              --archive \
                ".artifacts/native-fan-in/${architecture}/ofarm-ed25519.oci.tar" \
              --reproducibility \
                ".artifacts/native-fan-in/${architecture}/reproducibility.json" \
              --platform "linux/${architecture}" \
              --source-commit "${{ github.sha }}" \
              --containerfile deployment/postgresql/ofarm_ed25519/Containerfile \
              --builder-id \
                "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
              --output-directory \
                ".artifacts/native-fan-in/verified/${architecture}"
          done
      - name: Compose one canonical two-platform OCI index
        run: |
          python deployment/postgresql/native_evidence.py compose-index \
            --amd64-evidence \
              .artifacts/native-fan-in/verified/amd64/oci-evidence.json \
            --arm64-evidence \
              .artifacts/native-fan-in/verified/arm64/oci-evidence.json \
            --source-commit "${{ github.sha }}" \
            --index-output \
              .artifacts/native-index/ofarm-ed25519.index.json \
            --evidence-output \
              .artifacts/native-index/ofarm-ed25519.index-evidence.json
          test "$(du --bytes --summarize .artifacts/native-index | cut --fields=1)" \
            -le 1000000
      - name: Prepare or enforce the native release identity
        run: |
          python deployment/postgresql/native_evidence.py \
            prepare-release-identity \
            --checked-identity \
              deployment/postgresql/ofarm_ed25519/native_release_identity.json \
            --checked-receipt \
              deployment/postgresql/ofarm_ed25519/native_evidence_receipt.json \
            --index-evidence \
              .artifacts/native-index/ofarm-ed25519.index-evidence.json \
            --index .artifacts/native-index/ofarm-ed25519.index.json \
            --source-directory deployment/postgresql/ofarm_ed25519 \
            --repository-root . \
            --candidate-output \
              .artifacts/native-index/native_release_identity.candidate.json \
            --candidate-receipt-output \
              .artifacts/native-index/native_evidence_receipt.candidate.json
      - name: Upload canonical two-platform OCI index evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-verifier-index
          path: .artifacts/native-index/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
