# CI backing for the conformance evidence (steward review, PR #2 finding 5):
# the package self-check and the platform-MVP suite run on every push/PR so
# committed evidence is independently reproducible, not self-reported only.
name: conformance

on:
  push:
    branches: ["main", "m1/**"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ofarm
          POSTGRES_PASSWORD: ofarm
          POSTGRES_DB: ofarm_kernel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofarm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install fastapi uvicorn pytest "psycopg[binary]" jsonschema rfc3339-validator httpx
      - name: Package self-check (must PASS before anything else)
        run: python3 conformance/ofarm_pkg_contract_check.py
      - name: Platform MVP conformance suite + stage-contract tests
        env:
          OFARM_PG_DSN: "host=localhost port=5432 dbname=ofarm_kernel_test user=ofarm password=ofarm"
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
        run: python -m pytest kernel/tests/ -q
      - name: Verify generated manifest artifacts
        env:
          OFARM_PG_DSN: "host=localhost port=5432 dbname=ofarm_kernel_test user=ofarm password=ofarm"
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
        run: python3 -m kernel.manifest --verify-generated
      - name: Upload executed evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: conformance-evidence
          path: conformance/evidence/
