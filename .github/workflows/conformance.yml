# Deterministic review baseline for issue #168. Runtime behavior and claims
# are outside this workflow's scope.
name: conformance

on:
  push:
    branches: ["main", "m1/**"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Complete Python, stdlib, libc/loader, and native dependency identity.
      # The root stays immutable; only runner mounts and the explicit tmpfs
      # are writable during the job.
      image: python:3.12.13-bookworm@sha256:c36262cd12ed3eb4c32146f5268ea5037e04c688ccf32cdb04b6084671845541
      options: --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m
    services:
      postgres:
        # Immutable last-green PostgreSQL 17.10 artifact; the baseline also
        # verifies the SQL-observed server version before running tests.
        image: postgres@sha256:5f050f770b427fbd477edee6c3968a72e5c6be97e050a7e368b2b74a9494a285
        env:
          POSTGRES_USER: ofarm
          POSTGRES_PASSWORD: ofarm
          POSTGRES_DB: ofarm_kernel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofarm -d ofarm_kernel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Trust only the mounted checkout for Git evidence
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
      - name: Verify pinned container boundary
        run: |
          git --version
          python -c "import os,tempfile; assert os.statvfs('/usr/local').f_flag & os.ST_RDONLY; handle=tempfile.NamedTemporaryFile(); handle.write(b'ofarm'); handle.flush()"
          printf '#!/bin/sh\nexit 0\n' > /tmp/ofarm-noexec-probe
          chmod 700 /tmp/ofarm-noexec-probe
          if /tmp/ofarm-noexec-probe; then exit 1; fi
      - name: Create isolated locked environment
        run: |
          python -m venv .review-venv
          mkdir -p .review-venv/.ofarm-wheelhouse
          .review-venv/bin/python -m pip download --require-hashes --only-binary=:all: --no-deps --dest .review-venv/.ofarm-wheelhouse --requirement requirements-review-pip.lock
          .review-venv/bin/python -m pip install --no-compile --no-index --find-links .review-venv/.ofarm-wheelhouse --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-pip.lock
          .review-venv/bin/python -m pip download --require-hashes --only-binary=:all: --no-deps --dest .review-venv/.ofarm-wheelhouse --requirement requirements-review-baseline.lock
          .review-venv/bin/python -m pip install --no-compile --no-index --find-links .review-venv/.ofarm-wheelhouse --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-baseline.lock
          .review-venv/bin/python -m pip check
          find .review-venv -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find .review-venv -depth -type d -name __pycache__ -empty -delete
      - name: Complete Kernel baseline run 1
        env:
          OFARM_PG_ADMIN_DSN: "host=postgres port=5432 dbname=postgres user=ofarm password=ofarm"
        run: >-
          .review-venv/bin/python -I -B -S tooling/ofarm_isolated.py
          --venv-root .review-venv -m conformance.run_review_baseline
          run --output-dir .artifacts/review-baseline/run-1
      - name: Complete Kernel baseline run 2
        env:
          OFARM_PG_ADMIN_DSN: "host=postgres port=5432 dbname=postgres user=ofarm password=ofarm"
        run: >-
          .review-venv/bin/python -I -B -S tooling/ofarm_isolated.py
          --venv-root .review-venv -m conformance.run_review_baseline
          run --output-dir .artifacts/review-baseline/run-2
      - name: Prove clean-run equivalence
        run: >-
          .review-venv/bin/python -I -B -S tooling/ofarm_isolated.py
          --venv-root .review-venv -m conformance.run_review_baseline compare
          .artifacts/review-baseline/run-1/review-baseline-evidence.json
          .artifacts/review-baseline/run-2/review-baseline-evidence.json
          --output .artifacts/review-baseline/equivalence.json
      - name: Preserve root platform MVP evidence lane
        env:
          OFARM_PG_DSN: "host=postgres port=5432 dbname=ofarm_kernel_test user=ofarm password=ofarm"
          OFARM_PG_ADMIN_DSN: "host=postgres port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_PLATFORM_MVP_EVIDENCE_DIR: .artifacts/platform-evidence
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          TZ: UTC
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: >-
          .review-venv/bin/python -I -B -S tooling/ofarm_isolated.py
          --venv-root .review-venv -m pytest
          kernel/tests/test_conformance.py -q --assert=plain
          --import-mode=importlib -p no:cacheprovider
      - name: Upload deterministic review baseline
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: review-baseline
          path: .artifacts/review-baseline/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload root platform MVP evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-mvp-evidence
          path: .artifacts/platform-evidence/
          include-hidden-files: true
          if-no-files-found: error
