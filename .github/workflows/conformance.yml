          )
          identity = json.loads(
              (root / "native_release_identity.candidate.json").read_text(
                  encoding="utf-8"
              )
          )
          receipt = json.loads(
              (root / "native_evidence_receipt.candidate.json").read_text(
                  encoding="utf-8"
              )
          )
          if index.get("schemaVersion") != 2 or len(index.get("manifests", [])) != 2:
              raise SystemExit("native OCI index is incomplete")
          if (
              evidence.get("schema")
              != "ofarm.native-multi-platform-index-evidence.v3"
              or evidence.get("source_commit") != os.environ["EXPECTED_SOURCE"]
              or len(evidence.get("platforms", [])) != 2
          ):
              raise SystemExit("native index evidence is inconsistent")
          if (
              identity.get("schemaVersion")
              != "ofarm.native-verifier-release-identity.v1"
              or receipt.get("schemaVersion")
              != "ofarm.native-verifier-evidence-receipt.v2"
          ):
              raise SystemExit("native identity candidates are inconsistent")
          PY
      - name: Re-authenticate native-index policy before publication
        if: always()
        id: final-policy-proof
        run: >-
          test "$(git -C .baseline-admission-policy rev-parse HEAD)"
          = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
      - name: Recheck live admission before native-index publication
        if: always() && steps.final-policy-proof.outcome == 'success'
        id: final-admission
        env:
          OFARM_ADMISSION_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/python3
          .baseline-admission-policy/conformance/review_baseline_admission.py
          --operation admit
          --event-name "${GITHUB_EVENT_NAME}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-sha "${GITHUB_SHA}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --repository "${GITHUB_REPOSITORY}"
          --policy-sha "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          --github-output "${GITHUB_OUTPUT}"
          --evidence-output
          "${RUNNER_TEMP}/native-index-publisher-admission-final.json"
      - name: Prove complete native index evidence is publishable
        if: always()
        id: success-artifact-proof
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
          UPSTREAM_RESULT: ${{ needs.native-verifier-index.result }}
          START_ADMISSION_OUTCOME: ${{ steps.publisher-start-admission.outcome }}
          PROVISIONAL_PROOF_OUTCOME: ${{ steps.provisional-proof.outcome }}
          FINAL_POLICY_OUTCOME: ${{ steps.final-policy-proof.outcome }}
          FINAL_ADMISSION_OUTCOME: ${{ steps.final-admission.outcome }}
        run: |
          test "${PRIOR_JOB_STATUS}" = success
          test "${UPSTREAM_RESULT}" = success
          test "${START_ADMISSION_OUTCOME}" = success
          test "${PROVISIONAL_PROOF_OUTCOME}" = success
          test "${FINAL_POLICY_OUTCOME}" = success
          test "${FINAL_ADMISSION_OUTCOME}" = success
          test "${{ steps.final-admission.outputs.eligible }}" = true
          /usr/bin/cmp \
            "${RUNNER_TEMP}/native-index-publisher-admission-start.json" \
            "${RUNNER_TEMP}/native-index-publisher-admission-final.json"
          /usr/bin/cp \
            "${RUNNER_TEMP}/native-index-publisher-admission-final.json" \
            .publisher-input/native-index/review-baseline-admission.json
      - name: Upload canonical two-platform OCI index evidence
        if: always() && steps.success-artifact-proof.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-verifier-index
          path: .publisher-input/native-index/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed native-index publication separately
        if: >-
          always() &&
          steps.publisher-start-admission.outcome == 'success' &&
          steps.success-artifact-proof.outcome != 'success'
        id: failure-admission-receipt
        run: |
          /usr/bin/mkdir -p .publisher-failure/native-index
          /usr/bin/cp \
            "${RUNNER_TEMP}/native-index-publisher-admission-start.json" \
            .publisher-failure/native-index/admission.json
      - name: Upload failed native-index admission receipt
        if: >-
          always() &&
          steps.failure-admission-receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-verifier-index-admission-failure
          path: .publisher-failure/native-index/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
