# Deterministic review baseline for issue #168, extended with issue #174's
# live PostgreSQL provisioning boundary. It makes no production-readiness claim.
name: conformance

on:
  push:
    branches: ["main", "m1/**"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Immutable last-green PostgreSQL 17.10 artifact; the baseline also
        # verifies the SQL-observed server version before running tests.
        image: postgres@sha256:5f050f770b427fbd477edee6c3968a72e5c6be97e050a7e368b2b74a9494a285
        env:
          POSTGRES_USER: ofarm
          POSTGRES_PASSWORD: ofarm
          POSTGRES_DB: ofarm_kernel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofarm -d ofarm_kernel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      tenant-provisioning-postgres:
        # #174 provisioning tests require a dedicated cluster whose database
        # inventory contains only the PostgreSQL maintenance databases.
        image: postgres@sha256:5f050f770b427fbd477edee6c3968a72e5c6be97e050a7e368b2b74a9494a285
        env:
          POSTGRES_USER: ofarm
          POSTGRES_PASSWORD: tenant-ofarm
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ofarm -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      security-audit-postgres:
        # A second container and initdb lineage are required: a second database
        # inside the tenant cluster is not the accepted audit boundary.
        image: postgres@sha256:5f050f770b427fbd477edee6c3968a72e5c6be97e050a7e368b2b74a9494a285
        env:
          POSTGRES_USER: ofarm
          POSTGRES_PASSWORD: audit-ofarm
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ofarm -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          architecture: x64
      - name: Create isolated locked environment
        run: |
          python -m venv .review-venv
          .review-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-pip.lock
          .review-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-baseline.lock
          .review-venv/bin/python -m pip check
          python -m venv .review-tools-venv
          .review-tools-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-pip.lock
          .review-tools-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-tools.lock
          .review-tools-venv/bin/python -m pip check
      - name: Ruff PostgreSQL implementation
        run: >-
          .review-tools-venv/bin/python -m ruff check
          deployment/postgresql
          kernel/tests/test_migration_sets.py
          kernel/tests/test_postgresql_*.py
          kernel/tests/test_review_baseline.py
      - name: Authenticate tenant migration release
        run: .review-venv/bin/python -m deployment.postgresql.preflight_tenant_migrations
      - name: Authenticate security-audit migration release
        run: .review-venv/bin/python -m deployment.postgresql.preflight_security_audit_migrations
      - name: Reject whitespace errors
        run: >-
          git diff --check
          origin/${{ github.event.repository.default_branch }}...HEAD
      - name: Complete Kernel baseline run 1
        env:
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_TENANT_PROVISIONING_PG_ADMIN_DSN: "host=localhost port=5434 dbname=postgres user=ofarm password=tenant-ofarm"
          OFARM_SECURITY_AUDIT_PG_ADMIN_DSN: "host=localhost port=5433 dbname=postgres user=ofarm password=audit-ofarm"
        run: .review-venv/bin/python conformance/run_review_baseline.py run --output-dir .artifacts/review-baseline/run-1
      - name: Complete Kernel baseline run 2
        env:
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_TENANT_PROVISIONING_PG_ADMIN_DSN: "host=localhost port=5434 dbname=postgres user=ofarm password=tenant-ofarm"
          OFARM_SECURITY_AUDIT_PG_ADMIN_DSN: "host=localhost port=5433 dbname=postgres user=ofarm password=audit-ofarm"
        run: .review-venv/bin/python conformance/run_review_baseline.py run --output-dir .artifacts/review-baseline/run-2
      - name: Prove clean-run equivalence
        run: >-
          .review-venv/bin/python conformance/run_review_baseline.py compare
          .artifacts/review-baseline/run-1/review-baseline-evidence.json
          .artifacts/review-baseline/run-2/review-baseline-evidence.json
          --output .artifacts/review-baseline/equivalence.json
      - name: Preserve root platform MVP evidence lane
        env:
          OFARM_PG_DSN: "host=localhost port=5432 dbname=ofarm_kernel_test user=ofarm password=ofarm"
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_PLATFORM_MVP_EVIDENCE_DIR: .artifacts/platform-evidence
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          TZ: UTC
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: .review-venv/bin/python -m pytest kernel/tests/test_conformance.py -q -p no:cacheprovider
      - name: Upload deterministic review baseline
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: review-baseline
          path: .artifacts/review-baseline/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload root platform MVP evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-mvp-evidence
          path: .artifacts/platform-evidence/
          include-hidden-files: true
          if-no-files-found: error
