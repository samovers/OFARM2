# Deterministic review baseline for issue #168, extended with issue #174's
# live PostgreSQL provisioning boundary. It makes no production-readiness claim.
name: conformance

on:
  push:
    branches: ["main"]
  workflow_call:
    inputs:
      mode:
        description: Trusted admission transition
        required: true
        type: string
      pull_request_number:
        description: Pull-request number
        required: true
        type: string
      admission_comment_id:
        description: Created admission-comment identity
        required: false
        type: string
      reviewed_head_sha:
        description: Exact reviewed pull-request head
        required: false
        type: string
      base_sha:
        description: Live base coordinate at admission
        required: false
        type: string
      execution_merge_sha:
        description: Live execution merge coordinate at admission
        required: false
        type: string
      policy_sha:
        description: Trusted default-branch policy coordinate
        required: true
        type: string
      review_body_sha256:
        description: Exact UTF-8 admission body digest
        required: false
        type: string
      review_metadata:
        description: Canonical state, update-time, and association metadata
        required: false
        type: string
      revocation_reason:
        description: Trusted revocation reason
        required: false
        type: string

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'push'
        && format('ofarm-main-{0}', github.sha)
        || format('ofarm-called-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  OFARM_BASELINE_ADMISSION_POLICY_SHA: ${{ github.workflow_sha }}
  OFARM_BASELINE_ADMISSION_INPUTS: ${{ toJSON(inputs) }}

jobs:
  baseline-admission:
    name: live exact-head review admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.admission.outputs.eligible }}
      pull_request_number: ${{ steps.admission.outputs.pull_request_number }}
      admission_comment_id: ${{ steps.admission.outputs.admission_comment_id }}
      reviewed_head_sha: ${{ steps.admission.outputs.reviewed_head_sha }}
      base_sha: ${{ steps.admission.outputs.base_sha }}
      execution_merge_sha: ${{ steps.admission.outputs.execution_merge_sha }}
      policy_sha: ${{ steps.admission.outputs.policy_sha }}
      review_body_sha256: ${{ steps.admission.outputs.review_body_sha256 }}
      review_state: ${{ steps.admission.outputs.review_state }}
      review_updated_at: ${{ steps.admission.outputs.review_updated_at }}
      reviewer_association: ${{ steps.admission.outputs.reviewer_association }}
      reason: ${{ steps.admission.outputs.reason }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .baseline-admission-policy
          persist-credentials: false
      - name: Authenticate the immutable admission policy
        run: >-
          test "$(git -C .baseline-admission-policy rev-parse HEAD)"
          = "${GITHUB_WORKFLOW_SHA}"
      - name: Read live admission and merge coordinates
        id: admission
        env:
          OFARM_ADMISSION_TOKEN: ${{ github.token }}
        run: >-
          python3
          .baseline-admission-policy/conformance/review_baseline_admission.py
          --operation admit
          --event-name "${GITHUB_EVENT_NAME}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-sha "${GITHUB_SHA}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --repository "${GITHUB_REPOSITORY}"
          --policy-sha "${GITHUB_WORKFLOW_SHA}"
          --github-output "${GITHUB_OUTPUT}"

  conformance:
    needs: baseline-admission
    if: needs.baseline-admission.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.OFARM_BASELINE_ADMISSION_POLICY_SHA }}
          path: .baseline-admission-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate the immutable admission policy before conformance
        run: >-
          test "$(git -C .baseline-admission-policy rev-parse HEAD)"
          = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
      - name: Recheck live admission before conformance
        id: start-admission
        env:
          OFARM_ADMISSION_TOKEN: ${{ github.token }}
        run: >-
          python3
          .baseline-admission-policy/conformance/review_baseline_admission.py
          --operation admit
          --event-name "${GITHUB_EVENT_NAME}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-sha "${GITHUB_SHA}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --repository "${GITHUB_REPOSITORY}"
          --policy-sha "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          --github-output "${GITHUB_OUTPUT}"
          --evidence-output
          "${RUNNER_TEMP}/conformance-admission-start.json"
      - name: Bind conformance to the admitted coordinates
        env:
          ADMITTED_COMMENT: ${{ needs.baseline-admission.outputs.admission_comment_id }}
          ADMITTED_HEAD: ${{ needs.baseline-admission.outputs.reviewed_head_sha }}
          ADMITTED_BASE: ${{ needs.baseline-admission.outputs.base_sha }}
          ADMITTED_MERGE: ${{ needs.baseline-admission.outputs.execution_merge_sha }}
          ADMITTED_BODY: ${{ needs.baseline-admission.outputs.review_body_sha256 }}
          ADMITTED_STATE: ${{ needs.baseline-admission.outputs.review_state }}
          ADMITTED_UPDATED: ${{ needs.baseline-admission.outputs.review_updated_at }}
          ADMITTED_ASSOCIATION: ${{ needs.baseline-admission.outputs.reviewer_association }}
          START_COMMENT: ${{ steps.start-admission.outputs.admission_comment_id }}
          START_HEAD: ${{ steps.start-admission.outputs.reviewed_head_sha }}
          START_BASE: ${{ steps.start-admission.outputs.base_sha }}
          START_MERGE: ${{ steps.start-admission.outputs.execution_merge_sha }}
          START_POLICY: ${{ steps.start-admission.outputs.policy_sha }}
          START_BODY: ${{ steps.start-admission.outputs.review_body_sha256 }}
          START_STATE: ${{ steps.start-admission.outputs.review_state }}
          START_UPDATED: ${{ steps.start-admission.outputs.review_updated_at }}
          START_ASSOCIATION: ${{ steps.start-admission.outputs.reviewer_association }}
        run: |
          test "${START_COMMENT}" = "${ADMITTED_COMMENT}"
          test "${START_HEAD}" = "${ADMITTED_HEAD}"
          test "${START_BASE}" = "${ADMITTED_BASE}"
          test "${START_MERGE}" = "${ADMITTED_MERGE}"
          test "${START_POLICY}" = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          test "${START_BODY}" = "${ADMITTED_BODY}"
          test "${START_STATE}" = "${ADMITTED_STATE}"
          test "${START_UPDATED}" = "${ADMITTED_UPDATED}"
          test "${START_ASSOCIATION}" = "${ADMITTED_ASSOCIATION}"
          rm -rf -- .baseline-admission-policy
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.baseline-admission.outputs.execution_merge_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate and install the exact Buildx client
        env:
          BUILDX_ASSET_SHA256: >-
            f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b
        run: |
          buildx_asset="${RUNNER_TEMP}/buildx-v0.34.1.linux-amd64"
          buildx_binary="${RUNNER_TEMP}/ofarm-buildx-v0.34.1-linux-amd64"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 3 --output "${buildx_asset}" \
            "https://github.com/docker/buildx/releases/download/v0.34.1/buildx-v0.34.1.linux-amd64"
          printf '%s  %s\n' "${BUILDX_ASSET_SHA256}" "${buildx_asset}" | \
            sha256sum --check --strict
          install -m 0755 "${buildx_asset}" "${buildx_binary}"
          test "$("${buildx_binary}" version)" = \
            "github.com/docker/buildx v0.34.1 e0b0e77d18d3379bc1e0d55f3b37de288d36fe47"
          printf 'ISSUE174_BUILDX=%s\n' "${buildx_binary}" >> "${GITHUB_ENV}"
          printf 'ISSUE174_BUILDER=%s\n' \
            issue174-conformance-builder >> "${GITHUB_ENV}"
      - name: Create pinned native image builder
        run: |
          test -x "${ISSUE174_BUILDX}"
          "${ISSUE174_BUILDX}" create \
            --name "${ISSUE174_BUILDER}" \
            --driver docker-container \
            --driver-opt \
              image=moby/buildkit@sha256:c457984bd29f04d6acc90c8d9e717afe3922ae14665f3187e0096976fe37b1c8 \
            --buildkitd-flags \
              '--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host' \
            --use
          "${ISSUE174_BUILDX}" inspect \
            --builder "${ISSUE174_BUILDER}" --bootstrap
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          architecture: x64
      - name: Create isolated locked environment
        run: |
          python -m venv .review-venv
          .review-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-pip.lock
          .review-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-baseline.lock
          .review-venv/bin/python -m pip check
          python -m venv .review-tools-venv
          .review-tools-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-pip.lock
          .review-tools-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps --requirement requirements-review-tools.lock
          .review-tools-venv/bin/python -m pip check
      - name: Ruff PostgreSQL implementation
        run: >-
          .review-tools-venv/bin/python -m ruff check
          deployment/postgresql
          kernel/tests/test_migration_sets.py
          kernel/tests/test_postgresql_*.py
          kernel/tests/test_review_baseline.py
      - name: Authenticate tenant migration release
        run: .review-venv/bin/python -m deployment.postgresql.preflight_tenant_migrations
      - name: Authenticate security-audit migration release
        run: .review-venv/bin/python -m deployment.postgresql.preflight_security_audit_migrations
      - name: Authenticate and install the exact GitHub CLI
        shell: bash
        env:
          GITHUB_CLI_ARCHIVE_SHA256: >-
            83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
        run: |
          set -euo pipefail

          if test "${GH_TOKEN+x}" = x || test "${GITHUB_TOKEN+x}" = x
          then
            exit 1
          fi
          if git config --local --name-only --get-regexp \
              '^http\..*\.extraheader$' >/dev/null
          then
            exit 1
          else
            credential_status="$?"
            test "${credential_status}" -eq 1
          fi

          gh_install_root="$(mktemp --directory \
            "${RUNNER_TEMP}/ofarm-gh-v2.96.0.XXXXXX")"
          gh_archive="${gh_install_root}/gh_2.96.0_linux_amd64.tar.gz"
          gh_extract="${gh_install_root}/extract"
          gh_path_file="${gh_install_root}/canonical-path"
          gh_stdout="${gh_install_root}/version.stdout"
          gh_stderr="${gh_install_root}/version.stderr"
          mkdir -- "${gh_extract}"

          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 3 --output "${gh_archive}" \
            "https://github.com/cli/cli/releases/download/v2.96.0/gh_2.96.0_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            "${GITHUB_CLI_ARCHIVE_SHA256}" "${gh_archive}" | \
            sha256sum --check --strict
          tar --extract --gzip --file "${gh_archive}" \
            --directory "${gh_extract}" --strip-components=2 \
            gh_2.96.0_linux_amd64/bin/gh

          .review-venv/bin/python - \
              "${gh_extract}/gh" "${gh_extract}" "${gh_path_file}" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          candidate = Path(sys.argv[1]).resolve(strict=True)
          expected_parent = Path(sys.argv[2]).resolve(strict=True)
          file_stat = candidate.stat()
          if (
              candidate.parent != expected_parent
              or not stat.S_ISREG(file_stat.st_mode)
              or not os.access(candidate, os.X_OK)
          ):
              raise SystemExit(1)
          Path(sys.argv[3]).write_text(str(candidate) + "\n", encoding="ascii")
          PY
          IFS= read -r gh_binary < "${gh_path_file}"
          test -n "${gh_binary}"

          gh_status=0
          "${gh_binary}" version >"${gh_stdout}" 2>"${gh_stderr}" || \
            gh_status="$?"
          test "${gh_status}" -eq 0
          test -f "${gh_stdout}"
          test -f "${gh_stderr}"
          test ! -s "${gh_stderr}"
          .review-venv/bin/python - "${gh_stdout}" <<'PY'
          import sys
          from pathlib import Path

          from deployment.postgresql.native_release_identity import (
              NATIVE_RELEASE_GITHUB_CLI_VERSION_OUTPUT,
          )

          if Path(sys.argv[1]).read_bytes() != (
              NATIVE_RELEASE_GITHUB_CLI_VERSION_OUTPUT
          ):
              raise SystemExit(1)
          PY

          printf 'OFARM_NATIVE_EVIDENCE_GITHUB_CLI=%s\n' \
            "${gh_binary}" >> "${GITHUB_ENV}"
          printf '%s\n' "${gh_binary%/*}" >> "${GITHUB_PATH}"
      - name: Cryptographically reverify retained native release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .review-venv/bin/python - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          recorded_value = os.environ.get("OFARM_NATIVE_EVIDENCE_GITHUB_CLI")
          selected_value = shutil.which("gh")
          if recorded_value is None or selected_value is None:
              raise SystemExit(1)
          recorded = Path(recorded_value)
          if not recorded.is_absolute():
              raise SystemExit(1)
          recorded = recorded.resolve(strict=True)
          selected = Path(selected_value).resolve(strict=True)
          file_stat = selected.stat()
          if (
              selected != recorded
              or not stat.S_ISREG(file_stat.st_mode)
              or not os.access(selected, os.X_OK)
          ):
              raise SystemExit(1)
          PY
          .review-venv/bin/python deployment/postgresql/native_evidence.py \
            verify-frozen-evidence-receipt \
            --release-identity \
              deployment/postgresql/ofarm_ed25519/native_release_identity.json \
            --evidence-receipt \
              deployment/postgresql/ofarm_ed25519/native_evidence_receipt.json \
            --verification-currentness \
              deployment/postgresql/ofarm_ed25519/native_evidence_verification_currentness.json \
            --source-directory deployment/postgresql/ofarm_ed25519 \
            --repository-root .
      - name: Reject whitespace errors
        run: >-
          git diff --check
          origin/${{ github.event.repository.default_branch }}...HEAD
      - name: Build the derived PostgreSQL image
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          mkdir -p .artifacts/derived-postgresql
          "${ISSUE174_BUILDX}" build \
            --builder "${ISSUE174_BUILDER}" \
            --file deployment/postgresql/ofarm_ed25519/Containerfile \
            --platform linux/amd64 \
            --pull \
            --provenance=false \
            --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --output \
              "type=docker,dest=.artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar,oci-mediatypes=true" \
            --tag ofarm-postgresql-conformance:local \
            deployment/postgresql/ofarm_ed25519
      - name: Authenticate the derived PostgreSQL release identity
        run: |
          .review-venv/bin/python deployment/postgresql/native_evidence.py \
            conformance-environment \
            --checked-identity \
              deployment/postgresql/ofarm_ed25519/native_release_identity.json \
            --checked-receipt \
              deployment/postgresql/ofarm_ed25519/native_evidence_receipt.json \
            --verification-currentness \
              deployment/postgresql/ofarm_ed25519/native_evidence_verification_currentness.json \
            --archive \
              .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar \
            --source-directory deployment/postgresql/ofarm_ed25519 \
            --repository-root . \
            --image-name ofarm-postgresql-conformance:local \
            --archive-reference \
              .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar \
            > .artifacts/derived-postgresql/environment
          cat .artifacts/derived-postgresql/environment >> "$GITHUB_ENV"
      - name: Load the exact authenticated derived PostgreSQL image
        run: |
          if docker image inspect ofarm-postgresql-conformance:local \
            >/dev/null 2>&1
          then
            exit 1
          fi
          docker load --input \
            .artifacts/derived-postgresql/ofarm-postgresql-conformance.docker.tar
          observed_id="$(docker image inspect --format '{{.Id}}' \
            ofarm-postgresql-conformance:local)"
          if test "$observed_id" != \
              "$ISSUE174_DERIVED_POSTGRES_CHILD_DIGEST" \
            && test "$observed_id" != \
              "$ISSUE174_DERIVED_POSTGRES_CONFIG_DIGEST"
          then
            exit 1
          fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            ofarm-postgresql-conformance:local)" = "linux/amd64"
      - name: Start three independent derived PostgreSQL clusters
        run: |
          docker run --detach --name ofarm-conformance-main \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=ofarm \
            --env POSTGRES_DB=ofarm_kernel \
            --publish 5432:5432 \
            --health-cmd "pg_isready -U ofarm -d ofarm_kernel" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          docker run --detach --name ofarm-conformance-audit \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=audit-ofarm \
            --env POSTGRES_DB=postgres \
            --publish 5433:5432 \
            --health-cmd "pg_isready -U ofarm -d postgres" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          docker run --detach --name ofarm-conformance-provisioning \
            --env POSTGRES_USER=ofarm \
            --env POSTGRES_PASSWORD=tenant-ofarm \
            --env POSTGRES_DB=postgres \
            --publish 5434:5432 \
            --health-cmd "pg_isready -U ofarm -d postgres" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            ofarm-postgresql-conformance:local
          for container in \
            ofarm-conformance-main \
            ofarm-conformance-audit \
            ofarm-conformance-provisioning
          do
            state=""
            for attempt in {1..30}
            do
              state="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if test "$state" = healthy
              then
                break
              fi
              sleep 2
            done
            test "$state" = healthy
          done
      - name: Complete Kernel baseline run 1
        id: baseline-run-1
        env:
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_TENANT_PROVISIONING_PG_ADMIN_DSN: "host=localhost port=5434 dbname=postgres user=ofarm password=tenant-ofarm"
          OFARM_SECURITY_AUDIT_PG_ADMIN_DSN: "host=localhost port=5433 dbname=postgres user=ofarm password=audit-ofarm"
        run: .review-venv/bin/python conformance/run_review_baseline.py run --output-dir .artifacts/review-baseline/run-1
      - name: Complete Kernel baseline run 2
        id: baseline-run-2
        env:
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_TENANT_PROVISIONING_PG_ADMIN_DSN: "host=localhost port=5434 dbname=postgres user=ofarm password=tenant-ofarm"
          OFARM_SECURITY_AUDIT_PG_ADMIN_DSN: "host=localhost port=5433 dbname=postgres user=ofarm password=audit-ofarm"
        run: .review-venv/bin/python conformance/run_review_baseline.py run --output-dir .artifacts/review-baseline/run-2
      - name: Prove clean-run equivalence
        id: baseline-equivalence
        run: >-
          .review-venv/bin/python conformance/run_review_baseline.py compare
          .artifacts/review-baseline/run-1/review-baseline-evidence.json
          .artifacts/review-baseline/run-2/review-baseline-evidence.json
          --output .artifacts/review-baseline/equivalence.json
      - name: Preserve root platform MVP evidence lane
        id: platform-evidence
        env:
          OFARM_PG_DSN: "host=localhost port=5432 dbname=ofarm_kernel_test user=ofarm password=ofarm"
          OFARM_PG_ADMIN_DSN: "host=localhost port=5432 dbname=postgres user=ofarm password=ofarm"
          OFARM_PLATFORM_MVP_EVIDENCE_DIR: .artifacts/platform-evidence
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          TZ: UTC
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: .review-venv/bin/python -m pytest kernel/tests/test_conformance.py -q -p no:cacheprovider
      - name: Upload provisional conformance evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: conformance-provisional
          path: |
            .artifacts/review-baseline/
            .artifacts/platform-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable PostgreSQL clusters
        if: always()
        run: |
          docker rm --force \
            ofarm-conformance-main \
            ofarm-conformance-audit \
            ofarm-conformance-provisioning \
            || true
      - name: Remove pinned native image builder
        if: always()
        run: |
          if test -x "${ISSUE174_BUILDX:-}"
          then
            "${ISSUE174_BUILDX}" rm "${ISSUE174_BUILDER}" || true
          fi

  conformance-publisher:
    name: publish verified conformance evidence
    needs: [baseline-admission, conformance]
    if: >-
      always() &&
      needs.baseline-admission.result == 'success' &&
      needs.baseline-admission.outputs.eligible == 'true' &&
      needs.conformance.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.OFARM_BASELINE_ADMISSION_POLICY_SHA }}
          path: .baseline-admission-policy
          persist-credentials: false
      - name: Authenticate the immutable conformance publication policy
        run: >-
          test "$(git -C .baseline-admission-policy rev-parse HEAD)"
          = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
      - name: Recheck live admission before conformance validation
        id: publisher-start-admission
        env:
          OFARM_ADMISSION_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/python3
          .baseline-admission-policy/conformance/review_baseline_admission.py
          --operation admit
          --event-name "${GITHUB_EVENT_NAME}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-sha "${GITHUB_SHA}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --repository "${GITHUB_REPOSITORY}"
          --policy-sha "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          --github-output "${GITHUB_OUTPUT}"
          --evidence-output
          "${RUNNER_TEMP}/conformance-publisher-admission-start.json"
      - name: Bind conformance publisher to the admitted coordinates
        env:
          ADMITTED_COMMENT: ${{ needs.baseline-admission.outputs.admission_comment_id }}
          ADMITTED_HEAD: ${{ needs.baseline-admission.outputs.reviewed_head_sha }}
          ADMITTED_BASE: ${{ needs.baseline-admission.outputs.base_sha }}
          ADMITTED_MERGE: ${{ needs.baseline-admission.outputs.execution_merge_sha }}
          ADMITTED_BODY: ${{ needs.baseline-admission.outputs.review_body_sha256 }}
          ADMITTED_STATE: ${{ needs.baseline-admission.outputs.review_state }}
          ADMITTED_UPDATED: ${{ needs.baseline-admission.outputs.review_updated_at }}
          ADMITTED_ASSOCIATION: ${{ needs.baseline-admission.outputs.reviewer_association }}
          START_COMMENT: ${{ steps.publisher-start-admission.outputs.admission_comment_id }}
          START_HEAD: ${{ steps.publisher-start-admission.outputs.reviewed_head_sha }}
          START_BASE: ${{ steps.publisher-start-admission.outputs.base_sha }}
          START_MERGE: ${{ steps.publisher-start-admission.outputs.execution_merge_sha }}
          START_POLICY: ${{ steps.publisher-start-admission.outputs.policy_sha }}
          START_BODY: ${{ steps.publisher-start-admission.outputs.review_body_sha256 }}
          START_STATE: ${{ steps.publisher-start-admission.outputs.review_state }}
          START_UPDATED: ${{ steps.publisher-start-admission.outputs.review_updated_at }}
          START_ASSOCIATION: ${{ steps.publisher-start-admission.outputs.reviewer_association }}
        run: |
          test "${START_COMMENT}" = "${ADMITTED_COMMENT}"
          test "${START_HEAD}" = "${ADMITTED_HEAD}"
          test "${START_BASE}" = "${ADMITTED_BASE}"
          test "${START_MERGE}" = "${ADMITTED_MERGE}"
          test "${START_POLICY}" = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          test "${START_BODY}" = "${ADMITTED_BODY}"
          test "${START_STATE}" = "${ADMITTED_STATE}"
          test "${START_UPDATED}" = "${ADMITTED_UPDATED}"
          test "${START_ASSOCIATION}" = "${ADMITTED_ASSOCIATION}"
      - name: Download provisional conformance evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: conformance-provisional
          path: .publisher-input/conformance
      - name: Validate provisional conformance evidence
        id: provisional-proof
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".publisher-input/conformance")
          if not root.is_dir():
              raise SystemExit("provisional conformance artifact is missing")
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("provisional conformance artifact contains a symlink")
          if list(root.rglob("review-baseline-admission.json")):
              raise SystemExit("producer supplied an untrusted admission receipt")
          for run in ("run-1", "run-2"):
              path = root / "review-baseline" / run / "review-baseline-evidence.json"
              evidence = json.loads(path.read_text(encoding="utf-8"))
              if (
                  evidence.get("schemaVersion")
                  != "ofarm.review-baseline-evidence.v2"
                  or evidence.get("run", {}).get("outcome") != "passed"
              ):
                  raise SystemExit(f"unpublishable review baseline: {path}")
          comparison_path = root / "review-baseline" / "equivalence.json"
          comparison = json.loads(comparison_path.read_text(encoding="utf-8"))
          if (
              comparison.get("schemaVersion")
              != "ofarm.review-baseline-comparison.v2"
              or comparison.get("equivalent") is not True
          ):
              raise SystemExit("unpublishable review-baseline equivalence")
          platform_files = list(
              (root / "platform-evidence").glob("platform_mvp_results_*.json")
          )
          if len(platform_files) != 1:
              raise SystemExit("platform evidence set is incomplete")
          platform = json.loads(platform_files[0].read_text(encoding="utf-8"))
          if (
              platform.get("executed") is not True
              or platform.get("allPassed") is not True
              or platform.get("exitStatus") != 0
              or not platform.get("results")
          ):
              raise SystemExit("platform evidence did not pass")
          PY
      - name: Re-authenticate conformance policy before publication
        if: always()
        id: final-policy-proof
        run: >-
          test "$(git -C .baseline-admission-policy rev-parse HEAD)"
          = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
      - name: Recheck live admission before conformance publication
        if: always() && steps.final-policy-proof.outcome == 'success'
        id: final-admission
        env:
          OFARM_ADMISSION_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/python3
          .baseline-admission-policy/conformance/review_baseline_admission.py
          --operation admit
          --event-name "${GITHUB_EVENT_NAME}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-sha "${GITHUB_SHA}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --repository "${GITHUB_REPOSITORY}"
          --policy-sha "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          --github-output "${GITHUB_OUTPUT}"
          --evidence-output
          "${RUNNER_TEMP}/conformance-publisher-admission-final.json"
      - name: Prove complete conformance evidence is publishable
        if: always()
        id: success-artifact-proof
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
          UPSTREAM_RESULT: ${{ needs.conformance.result }}
          START_ADMISSION_OUTCOME: ${{ steps.publisher-start-admission.outcome }}
          PROVISIONAL_PROOF_OUTCOME: ${{ steps.provisional-proof.outcome }}
          FINAL_POLICY_OUTCOME: ${{ steps.final-policy-proof.outcome }}
          FINAL_ADMISSION_OUTCOME: ${{ steps.final-admission.outcome }}
        run: |
          test "${PRIOR_JOB_STATUS}" = success
          test "${UPSTREAM_RESULT}" = success
          test "${START_ADMISSION_OUTCOME}" = success
          test "${PROVISIONAL_PROOF_OUTCOME}" = success
          test "${FINAL_POLICY_OUTCOME}" = success
          test "${FINAL_ADMISSION_OUTCOME}" = success
          test "${{ steps.final-admission.outputs.eligible }}" = true
          /usr/bin/cmp \
            "${RUNNER_TEMP}/conformance-publisher-admission-start.json" \
            "${RUNNER_TEMP}/conformance-publisher-admission-final.json"
          /usr/bin/cp \
            "${RUNNER_TEMP}/conformance-publisher-admission-final.json" \
            .publisher-input/conformance/review-baseline/review-baseline-admission.json
          /usr/bin/cp \
            "${RUNNER_TEMP}/conformance-publisher-admission-final.json" \
            .publisher-input/conformance/platform-evidence/review-baseline-admission.json
      - name: Upload deterministic review baseline
        if: always() && steps.success-artifact-proof.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: review-baseline
          path: .publisher-input/conformance/review-baseline/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload root platform MVP evidence
        if: always() && steps.success-artifact-proof.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-mvp-evidence
          path: .publisher-input/conformance/platform-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve failed conformance publication separately
        if: >-
          always() &&
          steps.publisher-start-admission.outcome == 'success' &&
          steps.success-artifact-proof.outcome != 'success'
        id: failure-admission-receipt
        run: |
          /usr/bin/mkdir -p .publisher-failure/review-baseline-admission-failure
          /usr/bin/cp \
            "${RUNNER_TEMP}/conformance-publisher-admission-start.json" \
            .publisher-failure/review-baseline-admission-failure/admission.json
      - name: Upload failed conformance admission receipt
        if: >-
          always() &&
          steps.failure-admission-receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: review-baseline-admission-failure
          path: .publisher-failure/review-baseline-admission-failure/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native-verifier:
    needs: baseline-admission
    if: needs.baseline-admission.outputs.eligible == 'true'
    name: native verifier (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            python-architecture: x64
            machine: x86_64
            docker-architecture: x86_64
            buildx-sha256: >-
              f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b
          - runner: ubuntu-24.04-arm
            architecture: arm64
            python-architecture: arm64
            machine: aarch64
            docker-architecture: aarch64
            buildx-sha256: >-
              c34e32dd6ea2653d960d6c099c9f09b9077e4a37504d2d31e5066eccc3904231
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      BUILDX_METADATA_PROVENANCE: disabled
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.OFARM_BASELINE_ADMISSION_POLICY_SHA }}
          path: .baseline-admission-policy
          persist-credentials: false
      - name: Authenticate the immutable admission policy before native verification
        run: >-
          test "$(git -C .baseline-admission-policy rev-parse HEAD)"
          = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
      - name: Recheck live admission before native verification
        id: start-admission
        env:
          OFARM_ADMISSION_TOKEN: ${{ github.token }}
        run: >-
          python3
          .baseline-admission-policy/conformance/review_baseline_admission.py
          --operation admit
          --event-name "${GITHUB_EVENT_NAME}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-sha "${GITHUB_SHA}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --repository "${GITHUB_REPOSITORY}"
          --policy-sha "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          --github-output "${GITHUB_OUTPUT}"
          --evidence-output
          "${RUNNER_TEMP}/native-${{ matrix.architecture }}-admission-start.json"
      - name: Bind native verification to the admitted coordinates
        env:
          ADMITTED_COMMENT: ${{ needs.baseline-admission.outputs.admission_comment_id }}
          ADMITTED_HEAD: ${{ needs.baseline-admission.outputs.reviewed_head_sha }}
          ADMITTED_BASE: ${{ needs.baseline-admission.outputs.base_sha }}
          ADMITTED_MERGE: ${{ needs.baseline-admission.outputs.execution_merge_sha }}
          ADMITTED_BODY: ${{ needs.baseline-admission.outputs.review_body_sha256 }}
          ADMITTED_STATE: ${{ needs.baseline-admission.outputs.review_state }}
          ADMITTED_UPDATED: ${{ needs.baseline-admission.outputs.review_updated_at }}
          ADMITTED_ASSOCIATION: ${{ needs.baseline-admission.outputs.reviewer_association }}
          START_COMMENT: ${{ steps.start-admission.outputs.admission_comment_id }}
          START_HEAD: ${{ steps.start-admission.outputs.reviewed_head_sha }}
          START_BASE: ${{ steps.start-admission.outputs.base_sha }}
          START_MERGE: ${{ steps.start-admission.outputs.execution_merge_sha }}
          START_POLICY: ${{ steps.start-admission.outputs.policy_sha }}
          START_BODY: ${{ steps.start-admission.outputs.review_body_sha256 }}
          START_STATE: ${{ steps.start-admission.outputs.review_state }}
          START_UPDATED: ${{ steps.start-admission.outputs.review_updated_at }}
          START_ASSOCIATION: ${{ steps.start-admission.outputs.reviewer_association }}
        run: |
          test "${START_COMMENT}" = "${ADMITTED_COMMENT}"
          test "${START_HEAD}" = "${ADMITTED_HEAD}"
          test "${START_BASE}" = "${ADMITTED_BASE}"
          test "${START_MERGE}" = "${ADMITTED_MERGE}"
          test "${START_POLICY}" = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          test "${START_BODY}" = "${ADMITTED_BODY}"
          test "${START_STATE}" = "${ADMITTED_STATE}"
          test "${START_UPDATED}" = "${ADMITTED_UPDATED}"
          test "${START_ASSOCIATION}" = "${ADMITTED_ASSOCIATION}"
          rm -rf -- .baseline-admission-policy
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.baseline-admission.outputs.execution_merge_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          architecture: ${{ matrix.python-architecture }}
      - name: Authenticate and install the exact Buildx client
        env:
          BUILDX_ASSET_SHA256: ${{ matrix.buildx-sha256 }}
        run: |
          buildx_asset="${RUNNER_TEMP}/buildx-v0.34.1.linux-${{ matrix.architecture }}"
          buildx_binary="${RUNNER_TEMP}/ofarm-buildx-v0.34.1-linux-${{ matrix.architecture }}"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 3 --output "${buildx_asset}" \
            "https://github.com/docker/buildx/releases/download/v0.34.1/buildx-v0.34.1.linux-${{ matrix.architecture }}"
          printf '%s  %s\n' "${BUILDX_ASSET_SHA256}" "${buildx_asset}" | \
            sha256sum --check --strict
          install -m 0755 "${buildx_asset}" "${buildx_binary}"
          test "$("${buildx_binary}" version)" = \
            "github.com/docker/buildx v0.34.1 e0b0e77d18d3379bc1e0d55f3b37de288d36fe47"
          printf 'ISSUE174_BUILDX=%s\n' "${buildx_binary}" >> "${GITHUB_ENV}"
          printf 'ISSUE174_BUILDER=%s\n' \
            "issue174-native-${{ matrix.architecture }}-builder" >> "${GITHUB_ENV}"
      - name: Create pinned native image builder
        run: |
          test -x "${ISSUE174_BUILDX}"
          "${ISSUE174_BUILDX}" create \
            --name "${ISSUE174_BUILDER}" \
            --driver docker-container \
            --driver-opt \
              image=moby/buildkit@sha256:c457984bd29f04d6acc90c8d9e717afe3922ae14665f3187e0096976fe37b1c8 \
            --buildkitd-flags \
              '--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host' \
            --use
          "${ISSUE174_BUILDX}" inspect \
            --builder "${ISSUE174_BUILDER}" --bootstrap
      - name: Authenticate generated native verifier vectors
        run: >-
          python
          deployment/postgresql/ofarm_ed25519/generate_ofarm_ed25519_vectors.py
          --check
      - name: Require a native runner and Docker engine
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "$(docker info --format '{{.Architecture}}')" = \
            "${{ matrix.docker-architecture }}"
          test "$("${ISSUE174_BUILDX}" version)" = \
            "github.com/docker/buildx v0.34.1 e0b0e77d18d3379bc1e0d55f3b37de288d36fe47"
          mkdir -p \
            ".artifacts/native/${{ matrix.architecture }}/first" \
            ".artifacts/native/${{ matrix.architecture }}/second" \
            ".artifacts/native/${{ matrix.architecture }}/attestations"
          "${ISSUE174_BUILDX}" version > \
            ".artifacts/native/${{ matrix.architecture }}/buildx-version.txt"
      - name: Refuse every unsupported sanitizer selector
        run: |
          set +e
          "${ISSUE174_BUILDX}" build \
            --builder "${ISSUE174_BUILDER}" \
            --file deployment/postgresql/ofarm_ed25519/Containerfile \
            --platform "linux/${{ matrix.architecture }}" \
            --target sanitizer \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --build-arg SANITIZER=memory \
            --progress=plain \
            deployment/postgresql/ofarm_ed25519 \
            > ".artifacts/native/${{ matrix.architecture }}/invalid-sanitizer.log" \
            2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep --fixed-strings \
            'SANITIZER must be exactly address or undefined' \
            ".artifacts/native/${{ matrix.architecture }}/invalid-sanitizer.log"
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        shell: bash
        run: |
          set -o pipefail
          for sanitizer in address undefined
          do
            "${ISSUE174_BUILDX}" build \
              --builder "${ISSUE174_BUILDER}" \
              --file deployment/postgresql/ofarm_ed25519/Containerfile \
              --platform "linux/${{ matrix.architecture }}" \
              --target sanitizer \
              --pull \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 \
              --build-arg "SANITIZER=$sanitizer" \
              --progress=plain \
              deployment/postgresql/ofarm_ed25519 \
              2>&1 | tee \
              ".artifacts/native/${{ matrix.architecture }}/${sanitizer}.log"
          done
      - name: Exercise every verifier failure mapping in PostgreSQL
        run: |
          "${ISSUE174_BUILDX}" build \
            --builder "${ISSUE174_BUILDER}" \
            --file deployment/postgresql/ofarm_ed25519/Containerfile \
            --platform "linux/${{ matrix.architecture }}" \
            --target failure-semantics \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --progress=plain \
            deployment/postgresql/ofarm_ed25519
      - name: Produce two clean native child builds
        run: |
          for build in first second
          do
            "${ISSUE174_BUILDX}" build \
              --builder "${ISSUE174_BUILDER}" \
              --file deployment/postgresql/ofarm_ed25519/Containerfile \
              --platform "linux/${{ matrix.architecture }}" \
              --pull \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 \
              --output \
                "type=docker,dest=.artifacts/native/${{ matrix.architecture }}/${build}-image.docker.tar,oci-mediatypes=true" \
              --tag "ofarm-ed25519-${{ matrix.architecture }}:${build}" \
              deployment/postgresql/ofarm_ed25519
            "${ISSUE174_BUILDX}" build \
              --builder "${ISSUE174_BUILDER}" \
              --file deployment/postgresql/ofarm_ed25519/Containerfile \
              --platform "linux/${{ matrix.architecture }}" \
              --target evidence-artifacts \
              --pull \
              --provenance=false \
              --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 \
              --output \
                "type=local,dest=.artifacts/native/${{ matrix.architecture }}/${build}" \
              deployment/postgresql/ofarm_ed25519
            if test "$build" = first
            then
              "${ISSUE174_BUILDX}" prune \
                --builder "${ISSUE174_BUILDER}" \
                --all --force
            fi
          done
      - name: Prove child and installed-artifact reproducibility
        run: >-
          python deployment/postgresql/native_evidence.py compare-builds
          --first-archive
          ".artifacts/native/${{ matrix.architecture }}/first-image.docker.tar"
          --second-archive
          ".artifacts/native/${{ matrix.architecture }}/second-image.docker.tar"
          --first-artifacts
          ".artifacts/native/${{ matrix.architecture }}/first"
          --second-artifacts
          ".artifacts/native/${{ matrix.architecture }}/second"
          --platform "linux/${{ matrix.architecture }}"
          --source-commit "${{ needs.baseline-admission.outputs.execution_merge_sha }}"
          --output
          ".artifacts/native/${{ matrix.architecture }}/reproducibility.json"
      - name: Load and verify the authenticated clean native child
        run: |
          image="ofarm-ed25519-${{ matrix.architecture }}:second"
          if docker image inspect "$image" >/dev/null 2>&1
          then
            exit 1
          fi
          docker load --input \
            ".artifacts/native/${{ matrix.architecture }}/second-image.docker.tar"
          expected_child="$(python -c \
            'import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["child_digest"])' \
            ".artifacts/native/${{ matrix.architecture }}/reproducibility.json")"
          expected_config="$(python -c \
            'import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["config_digest"])' \
            ".artifacts/native/${{ matrix.architecture }}/reproducibility.json")"
          observed_id="$(docker image inspect --format '{{.Id}}' "$image")"
          if test "$observed_id" != "$expected_child" \
            && test "$observed_id" != "$expected_config"
          then
            exit 1
          fi
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "$image")" = "linux/${{ matrix.architecture }}"
          rm -- \
            ".artifacts/native/${{ matrix.architecture }}/first-image.docker.tar" \
            ".artifacts/native/${{ matrix.architecture }}/second-image.docker.tar"
          test ! -e \
            ".artifacts/native/${{ matrix.architecture }}/first-image.docker.tar"
          test ! -e \
            ".artifacts/native/${{ matrix.architecture }}/second-image.docker.tar"
      - name: Run the exact live PostgreSQL verifier smoke
        run: |
          docker run --detach --name ofarm-native-live \
            --env POSTGRES_PASSWORD=ofarm-native-test \
            --volume \
              "${{ github.workspace }}/deployment/postgresql/ofarm_ed25519/ofarm_ed25519_vectors.sql:/tmp/ofarm_ed25519_vectors.sql:ro" \
            "ofarm-ed25519-${{ matrix.architecture }}:second"
          state=""
          for attempt in {1..30}
          do
            state="$(docker inspect --format '{{.State.Status}}' ofarm-native-live)"
            if test "$state" = running \
              && docker exec ofarm-native-live pg_isready --username postgres
            then
              break
            fi
            sleep 2
          done
          test "$state" = running
          docker exec --interactive --user postgres ofarm-native-live \
            psql --username postgres --dbname postgres \
            < deployment/postgresql/ofarm_ed25519/ofarm_ed25519_live_test.sql
      - name: Produce bounded OCI, SBOM, and max-provenance evidence
        id: native-evidence
        run: |
          "${ISSUE174_BUILDX}" build \
            --builder "${ISSUE174_BUILDER}" \
            --file deployment/postgresql/ofarm_ed25519/Containerfile \
            --platform "linux/${{ matrix.architecture }}" \
            --pull \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --tag "ofarm-ed25519-evidence:${{ matrix.architecture }}" \
            --attest \
              "type=provenance,mode=max,version=v0.2,builder-id=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --attest \
              type=sbom,generator=docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68 \
            --output \
              "type=oci,dest=.artifacts/native/${{ matrix.architecture }}/ofarm-ed25519.oci.tar,oci-mediatypes=true" \
            --metadata-file \
              ".artifacts/native/${{ matrix.architecture }}/attested-metadata.json" \
            deployment/postgresql/ofarm_ed25519
          python deployment/postgresql/native_evidence.py collect-oci \
            --archive \
              ".artifacts/native/${{ matrix.architecture }}/ofarm-ed25519.oci.tar" \
            --reproducibility \
              ".artifacts/native/${{ matrix.architecture }}/reproducibility.json" \
            --platform "linux/${{ matrix.architecture }}" \
            --source-commit "${{ needs.baseline-admission.outputs.execution_merge_sha }}" \
            --containerfile deployment/postgresql/ofarm_ed25519/Containerfile \
            --builder-id \
              "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --output-directory \
              ".artifacts/native/${{ matrix.architecture }}/attestations"
          test "$(du --bytes --summarize \
            ".artifacts/native/${{ matrix.architecture }}" | cut --fields=1)" \
            -le 600000000
      - name: Upload bounded native verifier evidence provisionally
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-verifier-${{ matrix.architecture }}-provisional
          path: .artifacts/native/${{ matrix.architecture }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable native PostgreSQL
        if: always()
        run: docker rm --force ofarm-native-live || true
      - name: Remove pinned native image builder
        if: always()
        run: |
          if test -x "${ISSUE174_BUILDX:-}"
          then
            "${ISSUE174_BUILDX}" rm "${ISSUE174_BUILDER}" || true
          fi

  native-verifier-publisher:
    name: publish verified native evidence (${{ matrix.architecture }})
    needs: [baseline-admission, native-verifier]
    if: >-
      always() &&
      needs.baseline-admission.result == 'success' &&
      needs.baseline-admission.outputs.eligible == 'true' &&
      needs.native-verifier.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.OFARM_BASELINE_ADMISSION_POLICY_SHA }}
          path: .baseline-admission-policy
          persist-credentials: false
      - name: Authenticate the immutable native publication policy
        run: >-
          test "$(git -C .baseline-admission-policy rev-parse HEAD)"
          = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
      - name: Recheck live admission before native validation
        id: publisher-start-admission
        env:
          OFARM_ADMISSION_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/python3
          .baseline-admission-policy/conformance/review_baseline_admission.py
          --operation admit
          --event-name "${GITHUB_EVENT_NAME}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-sha "${GITHUB_SHA}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --repository "${GITHUB_REPOSITORY}"
          --policy-sha "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          --github-output "${GITHUB_OUTPUT}"
          --evidence-output
          "${RUNNER_TEMP}/native-${{ matrix.architecture }}-publisher-admission-start.json"
      - name: Bind native publisher to the admitted coordinates
        env:
          ADMITTED_COMMENT: ${{ needs.baseline-admission.outputs.admission_comment_id }}
          ADMITTED_HEAD: ${{ needs.baseline-admission.outputs.reviewed_head_sha }}
          ADMITTED_BASE: ${{ needs.baseline-admission.outputs.base_sha }}
          ADMITTED_MERGE: ${{ needs.baseline-admission.outputs.execution_merge_sha }}
          ADMITTED_BODY: ${{ needs.baseline-admission.outputs.review_body_sha256 }}
          ADMITTED_STATE: ${{ needs.baseline-admission.outputs.review_state }}
          ADMITTED_UPDATED: ${{ needs.baseline-admission.outputs.review_updated_at }}
          ADMITTED_ASSOCIATION: ${{ needs.baseline-admission.outputs.reviewer_association }}
          START_COMMENT: ${{ steps.publisher-start-admission.outputs.admission_comment_id }}
          START_HEAD: ${{ steps.publisher-start-admission.outputs.reviewed_head_sha }}
          START_BASE: ${{ steps.publisher-start-admission.outputs.base_sha }}
          START_MERGE: ${{ steps.publisher-start-admission.outputs.execution_merge_sha }}
          START_POLICY: ${{ steps.publisher-start-admission.outputs.policy_sha }}
          START_BODY: ${{ steps.publisher-start-admission.outputs.review_body_sha256 }}
          START_STATE: ${{ steps.publisher-start-admission.outputs.review_state }}
          START_UPDATED: ${{ steps.publisher-start-admission.outputs.review_updated_at }}
          START_ASSOCIATION: ${{ steps.publisher-start-admission.outputs.reviewer_association }}
        run: |
          test "${START_COMMENT}" = "${ADMITTED_COMMENT}"
          test "${START_HEAD}" = "${ADMITTED_HEAD}"
          test "${START_BASE}" = "${ADMITTED_BASE}"
          test "${START_MERGE}" = "${ADMITTED_MERGE}"
          test "${START_POLICY}" = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          test "${START_BODY}" = "${ADMITTED_BODY}"
          test "${START_STATE}" = "${ADMITTED_STATE}"
          test "${START_UPDATED}" = "${ADMITTED_UPDATED}"
          test "${START_ASSOCIATION}" = "${ADMITTED_ASSOCIATION}"
      - name: Download provisional native evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-verifier-${{ matrix.architecture }}-provisional
          path: .publisher-input/native/${{ matrix.architecture }}
      - name: Re-authenticate provisional native evidence with trusted code
        id: trusted-native-proof
        run: |
          /usr/bin/python3 \
            .baseline-admission-policy/deployment/postgresql/native_evidence.py \
            collect-oci \
            --archive \
              ".publisher-input/native/${{ matrix.architecture }}/ofarm-ed25519.oci.tar" \
            --reproducibility \
              ".publisher-input/native/${{ matrix.architecture }}/reproducibility.json" \
            --platform "linux/${{ matrix.architecture }}" \
            --source-commit \
              "${{ needs.baseline-admission.outputs.execution_merge_sha }}" \
            --containerfile \
              .baseline-admission-policy/deployment/postgresql/ofarm_ed25519/Containerfile \
            --builder-id \
              "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --output-directory \
              ".publisher-verified/native/${{ matrix.architecture }}"
          /usr/bin/cmp \
            ".publisher-input/native/${{ matrix.architecture }}/attestations/oci-evidence.json" \
            ".publisher-verified/native/${{ matrix.architecture }}/oci-evidence.json"
          /usr/bin/cmp \
            ".publisher-input/native/${{ matrix.architecture }}/attestations/sbom.spdx.in-toto.json" \
            ".publisher-verified/native/${{ matrix.architecture }}/sbom.spdx.in-toto.json"
          /usr/bin/cmp \
            ".publisher-input/native/${{ matrix.architecture }}/attestations/provenance.slsa-v0.2.in-toto.json" \
            ".publisher-verified/native/${{ matrix.architecture }}/provenance.slsa-v0.2.in-toto.json"
      - name: Validate provisional native evidence
        id: provisional-proof
        env:
          EXPECTED_PLATFORM: linux/${{ matrix.architecture }}
          EXPECTED_SOURCE: ${{ needs.baseline-admission.outputs.execution_merge_sha }}
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".publisher-input/native") / os.environ[
              "EXPECTED_PLATFORM"
          ].split("/")[1]
          if not root.is_dir():
              raise SystemExit("provisional native artifact is missing")
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("provisional native artifact contains a symlink")
          if (root / "review-baseline-admission.json").exists():
              raise SystemExit("producer supplied an untrusted admission receipt")
          archives = list(root.glob("*.oci.tar"))
          reproducibility = json.loads(
              (root / "reproducibility.json").read_text(encoding="utf-8")
          )
          evidence = json.loads(
              (root / "attestations/oci-evidence.json").read_text(encoding="utf-8")
          )
          if len(archives) != 1 or archives[0].stat().st_size <= 0:
              raise SystemExit("native OCI archive is missing")
          if (
              reproducibility.get("schema")
              != "ofarm.native-reproducibility-evidence.v1"
              or reproducibility.get("platform") != os.environ["EXPECTED_PLATFORM"]
              or reproducibility.get("source_commit") != os.environ["EXPECTED_SOURCE"]
          ):
              raise SystemExit("native reproducibility evidence is inconsistent")
          if (
              evidence.get("schema") != "ofarm.native-oci-evidence.v1"
              or evidence.get("platform") != os.environ["EXPECTED_PLATFORM"]
              or evidence.get("source_commit") != os.environ["EXPECTED_SOURCE"]
          ):
              raise SystemExit("native OCI evidence is inconsistent")
          for name in (
              "attestations/sbom.spdx.in-toto.json",
              "attestations/provenance.slsa-v0.2.in-toto.json",
          ):
              path = root / name
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"native attestation is missing: {name}")
          PY
      - name: Re-authenticate native policy before publication
        if: always()
        id: final-policy-proof
        run: >-
          test "$(git -C .baseline-admission-policy rev-parse HEAD)"
          = "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
      - name: Recheck live admission before native publication
        if: always() && steps.final-policy-proof.outcome == 'success'
        id: final-admission
        env:
          OFARM_ADMISSION_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/python3
          .baseline-admission-policy/conformance/review_baseline_admission.py
          --operation admit
          --event-name "${GITHUB_EVENT_NAME}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-sha "${GITHUB_SHA}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --repository "${GITHUB_REPOSITORY}"
          --policy-sha "${OFARM_BASELINE_ADMISSION_POLICY_SHA}"
          --github-output "${GITHUB_OUTPUT}"
          --evidence-output
          "${RUNNER_TEMP}/native-${{ matrix.architecture }}-publisher-admission-final.json"
      - name: Prove complete native evidence is publishable
        if: always()
        id: success-artifact-proof
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
          UPSTREAM_RESULT: ${{ needs.native-verifier.result }}
          START_ADMISSION_OUTCOME: ${{ steps.publisher-start-admission.outcome }}
          TRUSTED_NATIVE_PROOF_OUTCOME: ${{ steps.trusted-native-proof.outcome }}
          PROVISIONAL_PROOF_OUTCOME: ${{ steps.provisional-proof.outcome }}
          FINAL_POLICY_OUTCOME: ${{ steps.final-policy-proof.outcome }}
          FINAL_ADMISSION_OUTCOME: ${{ steps.final-admission.outcome }}
        run: |
          test "${PRIOR_JOB_STATUS}" = success
          test "${UPSTREAM_RESULT}" = success
          test "${START_ADMISSION_OUTCOME}" = success
          test "${TRUSTED_NATIVE_PROOF_OUTCOME}" = success
          test "${PROVISIONAL_PROOF_OUTCOME}" = success
          test "${FINAL_POLICY_OUTCOME}" = success
          test "${FINAL_ADMISSION_OUTCOME}" = success
          test "${{ steps.final-admission.outputs.eligible }}" = true
          /usr/bin/cmp \
            "${RUNNER_TEMP}/native-${{ matrix.architecture }}-publisher-admission-start.json" \
            "${RUNNER_TEMP}/native-${{ matrix.architecture }}-publisher-admission-final.json"
          /usr/bin/cp \
            "${RUNNER_TEMP}/native-${{ matrix.architecture }}-publisher-admission-final.json" \
            ".publisher-input/native/${{ matrix.architecture }}/review-baseline-admission.json"
      - name: Upload bounded native verifier evidence
        if: always() && steps.success-artifact-proof.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-verifier-${{ matrix.architecture }}
          path: .publisher-input/native/${{ matrix.architecture }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed native publication separately
        if: >-
          always() &&
          steps.publisher-start-admission.outcome == 'success' &&
          steps.success-artifact-proof.outcome != 'success'
        id: failure-admission-receipt
        run: |
          /usr/bin/mkdir -p \
            ".publisher-failure/native/${{ matrix.architecture }}"
          /usr/bin/cp \
            "${RUNNER_TEMP}/native-${{ matrix.architecture }}-publisher-admission-start.json" \
            ".publisher-failure/native/${{ matrix.architecture }}/admission.json"
      - name: Upload failed native admission receipt
        if: >-
          always() &&
          steps.failure-admission-receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-verifier-${{ matrix.architecture }}-admission-failure
          path: .publisher-failure/native/${{ matrix.architecture }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native-verifier-index:
