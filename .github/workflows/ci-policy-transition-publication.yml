          import os
          from pathlib import Path

          context = json.loads(Path(os.environ["CONTEXT_PATH"]).read_text("utf-8"))

          def digest(name: str) -> str:
              value = os.environ[name]
              return value if value.startswith("sha256:") else f"sha256:{value}"

