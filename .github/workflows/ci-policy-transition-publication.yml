          TICKET_DIGEST: ${{ steps.prepublish-admission.outputs.ticket_artifact_digest }}
          TICKET_ID: ${{ steps.prepublish-admission.outputs.ticket_artifact_id }}
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = (
              ("conformance-provisional", "CONFORMANCE_ID", "CONFORMANCE_DIGEST"),
              ("native-verifier-amd64-provisional", "AMD64_ID", "AMD64_DIGEST"),
              ("native-verifier-arm64-provisional", "ARM64_ID", "ARM64_DIGEST"),
              ("ci-policy-transition-ticket-v1", "TICKET_ID", "TICKET_DIGEST"),
          )
          context = {
              "provisionalArtifacts": [
                  {
                      "artifactId": int(os.environ[artifact_id]),
                      "digest": os.environ[digest],
                      "name": name,
                  }
                  for name, artifact_id, digest in artifacts
              ],
              "publisher": {
                  "runAttempt": int(os.environ["PUBLISHER_RUN_ATTEMPT"]),
                  "runId": int(os.environ["PUBLISHER_RUN_ID"]),
                  "workflowRef": os.environ["PUBLISHER_WORKFLOW_REF"],
                  "workflowSha": os.environ["PUBLISHER_WORKFLOW_SHA"],
              },
              "schemaVersion": "ofarm.evidence-publication-context.v1",
              "source": {
                  "eventName": os.environ["SOURCE_EVENT"],
                  "runAttempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
                  "runId": int(os.environ["SOURCE_RUN_ID"]),
                  "workflowRef": os.environ["SOURCE_WORKFLOW_REF"],
                  "workflowSha": os.environ["SOURCE_WORKFLOW_SHA"],
              },
          }
          Path(os.environ["CONTEXT_PATH"]).write_text(
              json.dumps(context, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          /usr/bin/cp \
            "$ADMISSION_PATH" \
            "$RUNNER_TEMP/ofarm-publication-stage/conformance/review-baseline/review-baseline-admission.json"
          /usr/bin/cp \
